name: Mixxx 2.4 Backport Build & Package

on:
  push:
    branches:
      - '2.4'
      - 'backport-2.4'
  pull_request:
    branches:
      - '2.4'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build & Package (Ubuntu Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Call the internal dependencies script if present in your 2.4 tree
          if [ -f tools/debian_buildenv.sh ]; then
            sudo bash tools/debian_buildenv.sh
          else
            sudo apt-get install -y build-essential cmake git libqt5svg5-dev libqt5sql5-sqlite qtscript5-dev
          fi

      - name: Configure CMake
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr/local \
                -S . -B build

      - name: Compile Mixxx Binary
        run: |
          cmake --build build --parallel $(nproc)

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mixxx-2.4-linux-build
          path: build/mixxx



