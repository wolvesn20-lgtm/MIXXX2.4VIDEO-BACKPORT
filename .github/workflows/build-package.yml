name: CMake Cloud Build and Package Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 360

    steps:
      - name: Checkout Primary Repository Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: source_repo

      # Fails in seconds (not after a 21-minute build) if a helper script is missing.
      # Works whether the scripts sit in .github/scripts/ or in the repo root.
      - name: Locate helper scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scripts"
          for f in finalize_bundle.py check_sdk_symbols.py; do
            found="$(find source_repo -maxdepth 3 -name "$f" \
              -not -path 'source_repo/source/*' -not -path 'source_repo/.git/*' | head -1)"
            if [ -z "$found" ]; then
              echo "::error::$f is not in the repository. Commit it to .github/scripts/."
              exit 1
            fi
            echo "$f found at $found"
            echo "  fingerprint: $(shasum -a 256 "$found" | cut -c1-16)"
            cp "$found" "$RUNNER_TEMP/scripts/$f"
          done
          echo "SCRIPTS_DIR=$RUNNER_TEMP/scripts" >> "$GITHUB_ENV"

      - name: Restore macOS 10.13 dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/deps-1013
          key: deps-1013-v4-${{ runner.os }}-${{ hashFiles('source_repo/triplets/*.cmake', 'source_repo/vcpkg-ports.txt') }}

      # vcpkg keeps a binary cache of every port it has built. Saving it even when the
      # job fails means a retry only rebuilds what had not finished yet.
      - name: Restore vcpkg binary cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-archives
          key: vcpkg-archives-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-archives-v1-${{ runner.os }}-

      - name: Build dependencies for macOS 10.13
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          set -f

          export VCPKG_DEFAULT_BINARY_CACHE="$GITHUB_WORKSPACE/vcpkg-archives"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

          # Ports built with autotools (libusb, ...) need these. Homebrew installs GNU
          # libtool as glibtool; the gnubin directory provides the plain names.
          brew install nasm pkg-config autoconf automake libtool autoconf-archive
          export PATH="$(brew --prefix libtool)/libexec/gnubin:$PATH"

          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"

          PORTS=$(grep -v '^[[:space:]]*#' source_repo/vcpkg-ports.txt | grep -v '^[[:space:]]*$' | tr '\n' ' ')

          # Check every port name now and report ALL unknown ones at once,
          # instead of failing on the first one minutes into the install.
          bad_ports=0
          for p in $PORTS; do
            base="${p%%\[*}"
            if [ ! -d "$RUNNER_TEMP/vcpkg/ports/$base" ]; then
              similar="$(ls "$RUNNER_TEMP/vcpkg/ports" | grep -i -- "${base#lib}" | head -6 | tr '\n' ' ' || true)"
              echo "::error::vcpkg has no port named '$base'. Similar names: ${similar:-none}"
              bad_ports=1
            fi
          done
          if [ "$bad_ports" -ne 0 ]; then exit 1; fi
          echo "All port names exist."

          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          VCPKG_LOG="$RUNNER_TEMP/vcpkg-install.log"
          if ! "$RUNNER_TEMP/vcpkg/vcpkg" install $PORTS \
            --overlay-triplets="$PWD/source_repo/triplets" \
            --triplet x64-osx-min1013-release \
            --x-install-root="$PWD/deps-1013" \
            --x-buildtrees-root="$RUNNER_TEMP/vcpkg-buildtrees" \
            --clean-after-build 2>&1 | tee "$VCPKG_LOG"; then
            echo
            echo "=============== vcpkg failed: first error messages ==============="
            grep -n -B3 -A25 -m3 -E 'CMake Error|^error: ' "$VCPKG_LOG" | head -150 || true
            echo
            echo "=============== vcpkg failed: error logs (last 70 lines each) ==============="
            for f in $(find "$RUNNER_TEMP/vcpkg-buildtrees" -name '*err.log' -size +0 2>/dev/null | head -8); do
              echo; echo "----- $f"; tail -n 70 "$f"
            done
            for f in $(find "$RUNNER_TEMP/vcpkg-buildtrees" -name 'config.log' 2>/dev/null | head -2); do
              echo; echo "----- $f (last 40 lines)"; tail -n 40 "$f"
            done
            exit 1
          fi

          DEPS="$PWD/deps-1013/x64-osx-min1013-release"

          # protoc is run during the Mixxx build. CMake strips build rpaths on install,
          # so without INSTALL_RPATH protoc cannot find libprotobuf and dies with
          # "Library not loaded: @rpath/libprotobuf...".
          git clone --depth 1 --branch v21.12 \
            https://github.com/protocolbuffers/protobuf.git "$RUNNER_TEMP/protobuf"
          cmake -S "$RUNNER_TEMP/protobuf/cmake" -B "$RUNNER_TEMP/protobuf/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_RPATH=@loader_path/../lib \
            -Dprotobuf_BUILD_SHARED_LIBS=ON \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_WITH_ZLIB=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS"
          cmake --build "$RUNNER_TEMP/protobuf/build" --parallel
          cmake --install "$RUNNER_TEMP/protobuf/build"

          git clone --depth 1 --branch 2.2.8 \
            https://github.com/mixxxdj/libkeyfinder.git "$RUNNER_TEMP/libkeyfinder"
          cmake -S "$RUNNER_TEMP/libkeyfinder" -B "$RUNNER_TEMP/libkeyfinder/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_PREFIX_PATH="$DEPS" \
            -DCMAKE_INSTALL_PREFIX="$DEPS"
          cmake --build "$RUNNER_TEMP/libkeyfinder/build" --parallel
          cmake --install "$RUNNER_TEMP/libkeyfinder/build"

      - name: Save vcpkg binary cache
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-archives
          key: vcpkg-archives-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Check every dependency really targets macOS 10.13
        run: |
          python3 "$SCRIPTS_DIR/finalize_bundle.py" \
            --scan-dir "$GITHUB_WORKSPACE/deps-1013/x64-osx-min1013-release/lib" \
            --min-macos 10.13

      # Fails within a minute if a library Mixxx needs is not in the dependency set,
      # instead of ~40 minutes later at the Mixxx configure step.
      - name: Check dependency inventory
        run: |
          set -uo pipefail
          DEPS="$GITHUB_WORKSPACE/deps-1013/x64-osx-min1013-release"
          LIB="$DEPS/lib"
          missing=0
          check() {
            label="$1"; shift
            for pat in "$@"; do
              if ls "$LIB"/$pat >/dev/null 2>&1; then
                printf '  ok       %s\n' "$label"; return 0
              fi
            done
            printf '  MISSING  %s   (looked for: %s)\n' "$label" "$*"
            missing=1
          }
          echo "Libraries expected in $LIB:"
          check "ffmpeg: avcodec"     'libavcodec*.dylib'
          check "ffmpeg: avformat"    'libavformat*.dylib'
          check "ffmpeg: avutil"      'libavutil*.dylib'
          check "ffmpeg: swscale"     'libswscale*.dylib'
          check "ffmpeg: swresample"  'libswresample*.dylib'
          check "FLAC"                'libFLAC.*dylib'
          check "ogg"                 'libogg*.dylib'
          check "vorbis"              'libvorbis.*dylib'
          check "vorbisenc"           'libvorbisenc*.dylib'
          check "vorbisfile"          'libvorbisfile*.dylib'
          check "opus"                'libopus*.dylib'
          check "mp3lame (LAME)"      'libmp3lame*.dylib' 'libmp3lame*.a'
          check "mpg123"              'libmpg123*.dylib'
          check "libsndfile"          'libsndfile*.dylib'
          check "libsamplerate"       'libsamplerate*.dylib'
          check "SoundTouch"          'libSoundTouch*.dylib'
          check "rubberband"          'librubberband*.dylib'
          check "chromaprint"         'libchromaprint*.dylib'
          check "ebur128"             'libebur128*.dylib'
          check "fftw3"               'libfftw3*.dylib'
          check "hidapi"              'libhidapi*.dylib'
          check "libusb"              'libusb*.dylib'
          check "portaudio"           'libportaudio*.dylib'
          check "portmidi"            'libportmidi*.dylib'
          check "protobuf"            'libprotobuf.*dylib'
          check "protobuf-lite"       'libprotobuf-lite*.dylib'
          check "libkeyfinder"        'libkeyfinder*.dylib'
          if [ ! -f "$DEPS/include/lame/lame.h" ]; then
            echo "  MISSING  header lame/lame.h"; missing=1
          fi
          echo
          echo "Everything under $DEPS that mentions lame:"
          find "$DEPS" -iname '*lame*' 2>/dev/null | head -20 || true
          echo
          echo "All libraries present:"
          ls "$LIB" | grep -E '\.(dylib|a)$' | grep -v -- '-[0-9]' | head -120 || true
          if [ "$missing" -ne 0 ]; then
            echo "::error::Some libraries are missing from the dependency set. Add the matching ports to vcpkg-ports.txt (the file shipped with this workflow lists them all) and rebuild."
            exit 1
          fi
          echo "Inventory complete."

      # Saved only after the dependencies passed the check, and immediately,
      # so a later failure in the job no longer throws the build away.
      - name: Save macOS 10.13 dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/deps-1013
          key: deps-1013-v4-${{ runner.os }}-${{ hashFiles('source_repo/triplets/*.cmake', 'source_repo/vcpkg-ports.txt') }}

      - name: Restore macOS 10.13 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/MacOSX10.13.sdk
          key: macosx-1013-sdk-v1

      - name: Download macOS 10.13 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          SDK_1013_URL: ${{ vars.SDK_1013_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk-dl" && cd "$RUNNER_TEMP/sdk-dl"
          urls="${SDK_1013_URL:-} https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.13.sdk.tar.xz https://github.com/phracker/MacOSX-SDKs/releases/download/10.15/MacOSX10.13.sdk.tar.xz"
          for url in $urls; do
            if curl -fsSL --retry 3 -o sdk.tar.xz "$url"; then break; fi
            rm -f sdk.tar.xz
          done
          if [ ! -s sdk.tar.xz ]; then
            echo "::error::Could not download the macOS 10.13 SDK. Set the repository variable SDK_1013_URL to a tarball that contains MacOSX10.13.sdk."
            exit 1
          fi
          tar -xf sdk.tar.xz
          mv MacOSX10.13.sdk "$GITHUB_WORKSPACE/MacOSX10.13.sdk"

      - name: Check dependency symbols against the macOS 10.13 SDK
        run: |
          python3 "$SCRIPTS_DIR/check_sdk_symbols.py" \
            --sdk "$GITHUB_WORKSPACE/MacOSX10.13.sdk" \
            "$GITHUB_WORKSPACE/deps-1013/x64-osx-min1013-release/lib"

      - name: Remove Test-Only moc Source from Mixxx Library
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cmake_file = Path("source_repo/source/CMakeLists.txt")
          lines = cmake_file.read_text().splitlines(keepends=True)
          target_line = "  src/util/moc_included_test.cpp\n"
          indexes = [i for i, line in enumerate(lines) if line == target_line]
          if len(indexes) != 2:
              raise SystemExit(
                  f"ERROR: Expected exactly 2 moc_included_test.cpp entries, "
                  f"found {len(indexes)}")
          del lines[indexes[0]]
          cmake_file.write_text("".join(lines))
          print("Removed moc_included_test.cpp from mixxx-lib.")
          PY
          grep -n "^[[:space:]]*src/util/moc_included_test.cpp[[:space:]]*$" \
            source_repo/source/CMakeLists.txt
          COUNT="$(grep -c "^[[:space:]]*src/util/moc_included_test.cpp[[:space:]]*$" \
              source_repo/source/CMakeLists.txt || true)"
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one remaining moc_included_test.cpp source entry."
            exit 1
          fi
          echo "Source patch verification successful."

      - name: Neutralize moc_included_test #error guard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target = Path("source_repo/source/src/util/moc_included_test.cpp")
          if not target.exists():
              raise SystemExit(f"ERROR: {target} not found")
          text = target.read_text()
          marker = "#error mocs_compilation.cpp not empty."
          if marker in text and not text.startswith("// " + marker):
              text = text.replace(marker, "// " + marker, 1)
              target.write_text(text)
              print("Neutralized #error guard.")
          else:
              print("Nothing to neutralize.")
          PY

      - name: Install Compatible CMake
        run: |
          set -euo pipefail
          brew uninstall --ignore-dependencies cmake || true
          curl -L \
            https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-macos-universal.tar.gz \
            -o /tmp/cmake.tar.gz
          sudo tar -xzf /tmp/cmake.tar.gz -C /usr/local
          CMAKE_DIR="/usr/local/cmake-3.28.6-macos-universal/CMake.app/Contents/bin"
          echo "$CMAKE_DIR" >> "$GITHUB_PATH"
          export PATH="$CMAKE_DIR:$PATH"
          cmake --version

      - name: Remove conflicting OpenSSL 1.1 link
        run: |
          set -euo pipefail
          brew unlink openssl@1.1 || true
          if [ -L "/usr/local/bin/openssl" ] && \
             readlink "/usr/local/bin/openssl" | grep -q "openssl@1.1"; then
            rm -f "/usr/local/bin/openssl"
          fi

      # Header-only packages (cpp-gsl, boost) still come from Homebrew. The Mixxx
      # configure step adds /usr/local/include at the LOWEST priority (-idirafter) so
      # the app finds them without ever shadowing the vcpkg 10.13 libraries.
      - name: Install Remaining Core Mixxx Dependencies
        run: |
          set -euo pipefail
          brew update
          brew install \
            googletest google-benchmark \
            boost cpp-gsl pkg-config

      - name: Install macdeployqt via Homebrew
        run: |
          set -euo pipefail
          brew install qt@5 || true
          QTBIN="/usr/local/opt/qt@5/bin"
          if [ -x "$QTBIN/macdeployqt" ]; then
            echo "Found macdeployqt at $QTBIN/macdeployqt"
            echo "$QTBIN" >> "$GITHUB_PATH"
          else
            echo "macdeployqt not found in qt@5; searching Homebrew prefix..."
            find /usr/local -name macdeployqt -type f 2>/dev/null || true
            exit 1
          fi

      - name: Set Up Qt5 Environment
        uses: jurplel/install-qt-action@v4
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          version: "5.15.2"
          host: "mac"
          target: "desktop"
          dir: "${{ github.workspace }}/qt"
          setup-python: true

      - name: Build Qt5Keychain
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 0.15.0 \
            https://github.com/frankosterfeld/qtkeychain.git qtkeychain_src
          WORKSPACE="${GITHUB_WORKSPACE}"
          QT_PREFIX="$WORKSPACE/qt/Qt/5.15.2/macos"
          QTKEYCHAIN_PREFIX="$WORKSPACE/qtkeychain_install"
          cmake -S qtkeychain_src -B qtkeychain_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$QTKEYCHAIN_PREFIX" \
            -DBUILD_WITH_QT6=OFF \
            -DBUILD_TRANSLATIONS=OFF \
            -DBUILD_TESTING=OFF
          cmake --build qtkeychain_build --config Release --parallel 4
          cmake --install qtkeychain_build --config Release

      # Restored from your earlier workflow: Mixxx 2.4 needs TagLib, and the
      # Homebrew taglib is no longer installed.
      - name: Checkout TagLib 1.11.1
        uses: actions/checkout@v4
        with:
          repository: taglib/taglib
          ref: v1.11.1
          path: taglib_src

      - name: Build TagLib
        run: |
          set -euo pipefail
          cmake -S taglib_src -B taglib_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/taglib_install"
          cmake --build taglib_build --config Release --parallel 4
          cmake --install taglib_build --config Release

      - name: Configure Mixxx CMake Project
        run: |
          set -euo pipefail
          rm -rf build
          DEPS="$GITHUB_WORKSPACE/deps-1013/x64-osx-min1013-release"
          QT_PREFIX="${GITHUB_WORKSPACE}/qt/Qt/5.15.2/macos"
          QTKEYCHAIN_PREFIX="${GITHUB_WORKSPACE}/qtkeychain_install"
          TAGLIB_PREFIX="${GITHUB_WORKSPACE}/taglib_install"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig:$DEPS/share/pkgconfig:${TAGLIB_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="$DEPS;${QT_PREFIX};${QTKEYCHAIN_PREFIX};${TAGLIB_PREFIX}"
          qmake -v

          # Point Mixxx's FindMp3lame at the vcpkg copy explicitly (variable names are
          # the ones CMake reported as missing).
          LAME_LIB="$(ls "$DEPS"/lib/libmp3lame*.dylib "$DEPS"/lib/libmp3lame*.a 2>/dev/null | head -1 || true)"
          LAME_FLAGS=""
          if [ -n "$LAME_LIB" ] && [ -f "$DEPS/include/lame/lame.h" ]; then
            LAME_FLAGS="-Dmp3lame_LIBRARY=$LAME_LIB -Dmp3lame_INCLUDE_DIR=$DEPS/include"
          fi
          echo "LAME hints: ${LAME_FLAGS:-none found}"

          QT5KEYCHAIN_CONFIG="$(
            find "${QTKEYCHAIN_PREFIX}" -type f \
              \( -name "Qt5KeychainConfig.cmake" -o -name "qt5keychain-config.cmake" \) \
              -print -quit
          )"
          if [ -z "$QT5KEYCHAIN_CONFIG" ]; then
            echo "ERROR: Qt5Keychain CMake package was not found."
            exit 1
          fi
          QT5KEYCHAIN_DIR="$(dirname "$QT5KEYCHAIN_CONFIG")"

          cmake -S source_repo/source -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/build/install" \
            -DCMAKE_EXE_LINKER_FLAGS="-framework AudioToolbox -framework AppKit -framework CoreVideo -framework CoreMedia" \
            -DCMAKE_CXX_FLAGS="-idirafter /usr/local/include" \
            -DTESTING=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCH=OFF \
            -DOPTIMIZE=portable \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DQt5Keychain_DIR="$QT5KEYCHAIN_DIR" \
            $LAME_FLAGS

      - name: Build Mixxx Application
        run: |
              set -euo pipefail
       cmake--build build --config Release --parallel 4 --target mixxx
