name: CMake Cloud Build and Package Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-macos-intel:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies via Homebrew
        run: |
          brew update
          # Install taglib@1 explicitly to avoid version 2.0+ conflicts
          brew install portmidi chromaprint libebur128 libkeyfinder flac portaudio libogg libvorbis rubberband sound-touch taglib@1
          
          # Force Homebrew to link and prioritize taglib@1 paths
          brew link --overwrite --force taglib@1

      - name: Configure CMake Project for High Sierra
        run: |
          mkdir -p build
          cmake -B build \
            -DCMAKE_PREFIX_PATH="/usr/local/opt/taglib@1;/usr/local" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPTIMIZATION=portable

      - name: Compile and Build Application
        run: |
          cmake --build build --config Release
