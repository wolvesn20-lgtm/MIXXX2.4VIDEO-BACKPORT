name: CMake Cloud Build and Package Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15-intel

    steps:
    - name: Checkout Primary Repository Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        path: source_repo

    - name: Install All Core Mixxx Dependencies
      run: |
        echo "Installing core libraries and frameworks..."
        # Omit taglib completely from Homebrew to avoid the unwanted v2.3 upgrade
        brew install ffmpeg googletest chromaprint google-benchmark libebur128 fftw libkeyfinder flac libvorbis sound-touch portaudio hidapi portmidi protobuf rubberband boost pkg-config

    - name: Set Up Qt5 Environment
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'mac'
        target: 'desktop'
        dir: '${{ github.workspace }}/qt'

    - name: Configure CMake Project for High Sierra
      run: |
        echo "Injecting isolated inline TagLib 1.11.1 FetchContent instructions..."
        
        # We append a clean, standalone compiler instruction directly to the top of the root configuration file.
        # This completely isolates the TagLib 1.11.1 download context and silences older policy restrictions.
        cat << 'EOF' > patch.txt
        include(FetchContent)
        set(CMAKE_POLICY_DEFAULT_CMP0022 NEW)
        FetchContent_Declare(
          TagLib
          URL https://github.com
          DOWNLOAD_EXTRACT_TIMESTAMP TRUE
        )
        FetchContent_MakeAvailable(TagLib)
        set(TagLib_FOUND TRUE)
        set(TagLib_LIBRARIES tag)
        set(TagLib_INCLUDE_DIRS ${taglib_BINARY_DIR} ${source_repo_SOURCE_DIR}/source_repo/source)
        EOF
        
        cat patch.txt source_repo/source/CMakeLists.txt > CMakeLists.txt.patched
        mv CMakeLists.txt.patched source_repo/source/CMakeLists.txt

        echo "Configuring main project tracking path mappings..."
        cmake -B build -S source_repo/source \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
          -DTESTING=OFF \
          -DBUILD_TESTING=OFF \
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/qt/Qt/5.15.2/macos/lib/cmake"

    - name: Compile and Build Application
      run: |
        cmake --build build --config Release --parallel 4

    - name: Package and Upload Completed Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MIXXX2.4-VIDEO-BACKPORT-BUILD
        path: build/
        retention-days: 7

