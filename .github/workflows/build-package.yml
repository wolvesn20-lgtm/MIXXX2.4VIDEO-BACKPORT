name: CMake Cloud Build and Package Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 360

    steps:
      - name: Checkout Primary Repository Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: source_repo

      - name: Locate helper scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scripts"
          for f in finalize_bundle.py check_sdk_symbols.py; do
            found="$(find source_repo -maxdepth 3 -name "$f" \
              -not -path 'source_repo/source/*' -not -path 'source_repo/.git/*' | head -1)"
            if [ -z "$found" ]; then
              echo "::error::$f is not in the repository. Commit it to .github/scripts/."
              exit 1
            fi
            echo "$f found at $found"
            cp "$found" "$RUNNER_TEMP/scripts/$f"
          done
          echo "SCRIPTS_DIR=$RUNNER_TEMP/scripts" >> "$GITHUB_ENV"

      - name: Restore macOS 10.13 dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/deps-1013
          key: deps-1013-v3-${{ runner.os }}-${{ hashFiles('source_repo/triplets/*.cmake', 'source_repo/vcpkg-ports.txt') }}

      - name: Build dependencies for macOS 10.13
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          set -f

          brew install nasm pkg-config autoconf automake libtool

          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

          PORTS=$(grep -v '^[[:space:]]*#' source_repo/vcpkg-ports.txt | grep -v '^[[:space:]]*$' | tr '\n' ' ')
          "$RUNNER_TEMP/vcpkg/vcpkg" install $PORTS \
            --overlay-triplets="$PWD/source_repo/triplets" \
            --triplet x64-osx-min1013-release \
            --x-install-root="$PWD/deps-1013" \
            --x-buildtrees-root="$RUNNER_TEMP/vcpkg-buildtrees" \
            --clean-after-build

          DEPS="$PWD/deps-1013/x64-osx-min1013-release"

          git clone --depth 1 --branch v21.12 \
            https://github.com/protocolbuffers/protobuf.git "$RUNNER_TEMP/protobuf"
          cmake -S "$RUNNER_TEMP/protobuf/cmake" -B "$RUNNER_TEMP/protobuf/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_RPATH=@loader_path/../lib \
            -Dprotobuf_BUILD_SHARED_LIBS=ON \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_WITH_ZLIB=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS"
          cmake --build "$RUNNER_TEMP/protobuf/build" --parallel
          cmake --install "$RUNNER_TEMP/protobuf/build"

          git clone --depth 1 --branch 2.2.8 \
            https://github.com/mixxxdj/libkeyfinder.git "$RUNNER_TEMP/libkeyfinder"
          cmake -S "$RUNNER_TEMP/libkeyfinder" -B "$RUNNER_TEMP/libkeyfinder/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_PREFIX_PATH="$DEPS" \
            -DCMAKE_INSTALL_PREFIX="$DEPS"
          cmake --build "$RUNNER_TEMP/libkeyfinder/build" --parallel
          cmake --install "$RUNNER_TEMP/libkeyfinder/build"

      - name: Check every dependency really targets macOS 10.13
        run: |
          python3 "$SCRIPTS_DIR/finalize_bundle.py" \
            --scan-dir "$GITHUB_WORKSPACE/deps-1013/x64-osx-min1013-release/lib" \
            --min-macos 10.13

      - name: Save macOS 10.13 dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/deps-1013
          key: deps-1013-v3-${{ runner.os }}-${{ hashFiles('source_repo/triplets/*.cmake', 'source_repo/vcpkg-ports.txt') }}

      - name: Restore macOS 10.13 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/MacOSX10.13.sdk
          key: macosx-1013-sdk-v1

      - name: Download macOS 10.13 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          SDK_1013_URL: ${{ vars.SDK_1013_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk-dl" && cd "$RUNNER_TEMP/sdk-dl"
          urls="${SDK_1013_URL:-} https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.13.sdk.tar.xz https://github.com/phracker/MacOSX-SDKs/releases/download/10.15/MacOSX10.13.sdk.tar.xz"
          for url in $urls; do
            if curl -fsSL --retry 3 -o sdk.tar.xz "$url"; then break; fi
            rm -f sdk.tar.xz
          done
          if [ ! -s sdk.tar.xz ]; then
            echo "::error::Could not download the macOS 10.13 SDK. Set the repository variable SDK_1013_URL to a tarball that contains MacOSX10.13.sdk."
            exit 1
          fi
          tar -xf sdk.tar.xz
          mv MacOSX10.13.sdk "$GITHUB_WORKSPACE/MacOSX10.13.sdk"

      - name: Check dependency symbols against the macOS 10.13 SDK
        run: |
          python3 "$SCRIPTS_DIR/check_sdk_symbols.py" \
            --sdk "$GITHUB_WORKSPACE/MacOSX10.13.sdk" \
            "$GITHUB_WORKSPACE/deps-1013/x64-osx-min1013-release/lib"

      - name: Remove Test-Only moc Source from Mixxx Library
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cmake_file = Path("source_repo/source/CMakeLists.txt")
          lines = cmake_file.read_text().splitlines(keepends=True)
          target_line = "  src/util/moc_included_test.cpp\n"
          indexes = [i for i, line in enumerate(lines) if line == target_line]
          if len(indexes) != 2:
              raise SystemExit(
                  f"ERROR: Expected exactly 2 moc_included_test.cpp entries, "
                  f"found {len(indexes)}")
          del lines[indexes[0]]
          cmake_file.write_text("".join(lines))
          print("Removed moc_included_test.cpp from mixxx-lib.")
          PY
          grep -n "^[[:space:]]*src/util/moc_included_test.cpp[[:space:]]*$" \
            source_repo/source/CMakeLists.txt
          COUNT="$(grep -c "^[[:space:]]*src/util/moc_included_test.cpp[[:space:]]*$" \
              source_repo/source/CMakeLists.txt || true)"
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one remaining moc_included_test.cpp source entry."
            exit 1
          fi
          echo "Source patch verification successful."

      - name: Neutralize moc_included_test #error guard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target = Path("source_repo/source/src/util/moc_included_test.cpp")
          if not target.exists():
              raise SystemExit(f"ERROR: {target} not found")
          text = target.read_text()
          marker = "#error mocs_compilation.cpp not empty."
          if marker in text and not text.startswith("// " + marker):
              text = text.replace(marker, "// " + marker, 1)
              target.write_text(text)
              print("Neutralized #error guard.")
          else:
              print("Nothing to neutralize.")
          PY

      - name: Install Compatible CMake
        run: |
          set -euo pipefail
          brew uninstall --ignore-dependencies cmake || true
          curl -L \
            https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-macos-universal.tar.gz \
            -o /tmp/cmake.tar.gz
          sudo tar -xzf /tmp/cmake.tar.gz -C /usr/local
          CMAKE_DIR="/usr/local/cmake-3.28.6-macos-universal/CMake.app/Contents/bin"
          echo "$CMAKE_DIR" >> "$GITHUB_PATH"
          export PATH="$CMAKE_DIR:$PATH"
          cmake --version

      - name: Remove conflicting OpenSSL 1.1 link
        run: |
          set -euo pipefail
          brew unlink openssl@1.1 || true
          if [ -L "/usr/local/bin/openssl" ] && \
             readlink "/usr/local/bin/openssl" | grep -q "openssl@1.1"; then
            rm -f "/usr/local/bin/openssl"
          fi

      - name: Install Remaining Core Mixxx Dependencies
        run: |
          set -euo pipefail
          brew update
          brew install \
            googletest google-benchmark \
            boost cpp-gsl pkg-config \
            hidapi portmidi libusb

      - name: Install macdeployqt via Homebrew
        run: |
          set -euo pipefail
          brew install qt@5 || true
          QTBIN="/usr/local/opt/qt@5/bin"
          if [ -x "$QTBIN/macdeployqt" ]; then
            echo "Found macdeployqt at $QTBIN/macdeployqt"
            echo "$QTBIN" >> "$GITHUB_PATH"
          else
            echo "macdeployqt not found in qt@5; searching Homebrew prefix..."
            find /usr/local -name macdeployqt -type f 2>/dev/null || true
            exit 1
          fi

      - name: Set Up Qt5 Environment
        uses: jurplel/install-qt-action@v4
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          version: "5.15.2"
          host: "mac"
          target: "desktop"
          dir: "${{ github.workspace }}/qt"
          setup-python: true

      - name: Build Qt5Keychain
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 0.15.0 \
            https://github.com/frankosterfeld/qtkeychain.git qtkeychain_src
          WORKSPACE="${GITHUB_WORKSPACE}"
          QT_PREFIX="$WORKSPACE/qt/Qt/5.15.2/macos"
          QTKEYCHAIN_PREFIX="$WORKSPACE/qtkeychain_install"
          cmake -S qtkeychain_src -B qtkeychain_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$QTKEYCHAIN_PREFIX" \
            -DBUILD_WITH_QT6=OFF \
            -DBUILD_TRANSLATIONS=OFF \
            -DBUILD_TESTING=OFF
          cmake --build qtkeychain_build --config Release --parallel 4
          cmake --install qtkeychain_build --config Release

      - name: Checkout TagLib 1.11.1
        uses: actions/checkout@v4
        with:
          repository: taglib/taglib
          ref: v1.11.1
          path: taglib_src

      - name: Build TagLib
        run: |
          set -euo pipefail
          cmake -S taglib_src -B taglib_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/taglib_install"
          cmake --build taglib_build --config Release --parallel 4
          cmake --install taglib_build --config Release

      - name: Configure Mixxx CMake Project
        run: |
          set -euo pipefail
          rm -rf build
          DEPS="$GITHUB_WORKSPACE/deps-1013/x64-osx-min1013-release"
          QT_PREFIX="${GITHUB_WORKSPACE}/qt/Qt/5.15.2/macos"
          QTKEYCHAIN_PREFIX="${GITHUB_WORKSPACE}/qtkeychain_install"
          TAGLIB_PREFIX="${GITHUB_WORKSPACE}/taglib_install"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig:$DEPS/share/pkgconfig:${TAGLIB_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="$DEPS;${QT_PREFIX};${QTKEYCHAIN_PREFIX};${TAGLIB_PREFIX}"
          qmake -v

          QT5KEYCHAIN_CONFIG="$(
            find "${QTKEYCHAIN_PREFIX}" -type f \
              \( -name "Qt5KeychainConfig.cmake" -o -name "qt5keychain-config.cmake" \) \
              -print -quit
          )"
          if [ -z "$QT5KEYCHAIN_CONFIG" ]; then
            echo "ERROR: Qt5Keychain CMake package was not found."
            exit 1
          fi
          QT5KEYCHAIN_DIR="$(dirname "$QT5KEYCHAIN_CONFIG")"

          cmake -S source_repo/source -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_EXE_LINKER_FLAGS="-framework AudioToolbox -framework AppKit -framework CoreVideo -framework CoreMedia -L$DEPS/lib -lswscale -lavcodec -lavformat -lavutil -lswresample" \
            -DTESTING=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCH=OFF \
            -DOPTIMIZE=portable \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DQt5Keychain_DIR="$QT5KEYCHAIN_DIR"

      - name: Build Mixxx Application
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel 4 --target mixxx

      - name: Assemble Mixxx.app bundle
        run: |
          set -euo pipefail
          WORKSPACE="${GITHUB_WORKSPACE}"
          MXXX_BIN="${WORKSPACE}/build/mixxx" 
          APP="${WORKSPACE}/build/Mixxx.app"

          if [ ! -f "${MXXX_BIN}" ]; then
            echo "ERROR: ${MXXX_BIN} not found."
            ls -la "${WORKSPACE}/build" || true
            exit 1
          fi

          rm -rf "$APP"
          mkdir -p "${APP}/Contents/MacOS"
          mkdir -p "${APP}/Contents/Resources"
          mkdir -p "${APP}/Contents/Frameworks"

          cp "${MXXX_BIN}" "${APP}/Contents/MacOS/mixxx"
          chmod +x "${APP}/Contents/MacOS/mixxx"

          if [ -d "${WORKSPACE}/source_repo/res" ]; then
            cp -R "${WORKSPACE}/source_repo/res/." "${APP}/Contents/Resources/"
          fi

          cat > "${APP}/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>Mixxx</string>
              <key>CFBundleDisplayName</key><string>Mixxx</string>
              <key>CFBundleIdentifier</key><string>org.mixxx.Mixxx</string>
              <key>CFBundleVersion</key><string>2.4.2</string>
              <key>CFBundleShortVersionString</key><string>2.4.2</string>
              <key>CFBundleExecutable</key><string>mixxx</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleSignature</key><string>????</string>
              <key>LSMinimumSystemVersion</key><string>10.13</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>NSMicrophoneUsageDescription</key>
              <string>Mixxx needs microphone access for recording and broadcasting.</string>
              <key>CFBundleIconFile</key><string>mixxx.icns</string>
          </dict>
          </plist>
          PLIST

          ICON_SRC="${WORKSPACE}/source_repo/res/images/mixxx.icns"
          if [ -f "$ICON_SRC" ]; then
            cp "$ICON_SRC" "${APP}/Contents/Resources/mixxx.icns"
          fi

          echo "MXXX_APP_PATH=${APP}" >> "$GITHUB_ENV"

      - name: Bundle Qt frameworks with macdeployqt
        run: |
          set -euo pipefail
          APP="${MXXX_APP_PATH}"
          DEPS="$GITHUB_WORKSPACE/deps-1013/x64-osx-min1013-release"
          
          MACDEPLOYQT="$(command -v macdeployqt || true)"
          if [ -z "$MACDEPLOYQT" ]; then
            MACDEPLOYQT="$(find /usr/local -name macdeployqt -type f 2>/dev/null | head -1)"
          fi
          echo "Using macdeployqt: $MACDEPLOYQT"
          
          "$MACDEPLOYQT" "$APP" -verbose=2 \
            -libpath="$DEPS/lib" \
            -libpath="${{ github.workspace }}/qtkeychain_install/lib" \
            -libpath=/usr/local/lib \
            -libpath=/usr/local/opt/qt@5/lib \
            -libpath="${{ github.workspace }}/qt/Qt/5.15.2/macos/lib" || true

      - name: Finalize bundle using strict 10.13 validation
        run: |
          python3 "$SCRIPTS_DIR/finalize_bundle.py" "$MXXX_APP_PATH" \
            --qt-dir "${{ github.workspace }}/qt/Qt/5.15.2/macos" \
            --search "$GITHUB_WORKSPACE/deps-1013/x64-osx-min1013-release/lib" \
            --search "${GITHUB_WORKSPACE}/qtkeychain_install/lib" \
            --min-macos 10.13

      - name: Final symbol check against the macOS 10.13 SDK
        run: |
          python3 "$SCRIPTS_DIR/check_sdk_symbols.py" \
            --sdk "$GITHUB_WORKSPACE/MacOSX10.13.sdk" "$MXXX_APP_PATH"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          set -euo pipefail
          APP="${MXXX_APP_PATH}"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: MXXX_APP_PATH not set or invalid: '$APP'"
            exit 1
          fi
          OUT="Mixxx-2.4-VIDEO-BACKPORT-macOS-10.13.dmg"
          rm -f "$OUT"
          create-dmg \
            --volname "Mixxx 2.4" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "$OUT" \
            "$APP" || true
          if [ ! -f "$OUT" ]; then
            echo "ERROR: DMG was not created."
            exit 1
          fi
          ls -lh "$OUT"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: MIXXX2.4-VIDEO-BACKPORT-macos-intel-DMG
          path: Mixxx-2.4-VIDEO-BACKPORT-macOS-10.13.dmg
          if-no-files-found: error
          retention-days: 7
