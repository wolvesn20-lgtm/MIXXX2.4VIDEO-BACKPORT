name: CMake Cloud Build and Package Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15-intel

    steps:
      - name: Checkout Primary Repository Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: source_repo

      - name: Install Compatible CMake
        run: |
          set -euxo pipefail

          brew uninstall --ignore-dependencies cmake || true

          curl -L \
            https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-macos-universal.tar.gz \
            -o /tmp/cmake.tar.gz

          sudo tar -xzf /tmp/cmake.tar.gz -C /usr/local

          CMAKE_DIR="/usr/local/cmake-3.28.6-macos-universal/CMake.app/Contents/bin"

          echo "$CMAKE_DIR" >> "$GITHUB_PATH"
          export PATH="$CMAKE_DIR:$PATH"

          cmake --version

      - name: Remove conflicting OpenSSL 1.1 link
        run: |
          set -euxo pipefail

          brew unlink openssl@1.1 || true

          if [ -L "/usr/local/bin/openssl" ] && readlink "/usr/local/bin/openssl" | grep -q "openssl@1.1"; then
            rm -f "/usr/local/bin/openssl"
          fi

      - name: Install All Core Mixxx Dependencies
        run: |
          set -euxo pipefail

          brew update

          brew install \
            ffmpeg \
            googletest \
            chromaprint \
            google-benchmark \
            libebur128 \
            fftw \
            libkeyfinder \
            flac \
            libvorbis \
            sound-touch \
            portaudio \
            hidapi \
            portmidi \
            protobuf \
            rubberband \
            boost \
            taglib \
            cpp-gsl \
            pkg-config

      - name: Set Up Qt5 Environment
        uses: jurplel/install-qt-action@v4
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          version: "5.15.2"
          host: "mac"
          target: "desktop"
          dir: "${{ github.workspace }}/qt"
          setup-python: true

      - name: Build Qt5Keychain
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch 0.15.0 \
            https://github.com/frankosterfeld/qtkeychain.git \
            qtkeychain_src

          WORKSPACE="${GITHUB_WORKSPACE}"
          QT_PREFIX="$WORKSPACE/qt/Qt/5.15.2/macos"
          QTKEYCHAIN_PREFIX="$WORKSPACE/qtkeychain_install"

          cmake \
            -S qtkeychain_src \
            -B qtkeychain_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$QTKEYCHAIN_PREFIX" \
            -DBUILD_WITH_QT6=OFF \
            -DBUILD_TRANSLATIONS=OFF \
            -DBUILD_TESTING=OFF

          cmake \
            --build qtkeychain_build \
            --config Release \
            --parallel 4

          cmake \
            --install qtkeychain_build \
            --config Release

          echo "Qt5Keychain installation:"
          find "${QTKEYCHAIN_PREFIX}" -type f | sort

      - name: Clone Legacy TagLib 1.11.1 Source
        uses: actions/checkout@v4
        with:
          repository: taglib/taglib
          ref: v1.11.1
          path: taglib_src

      - name: Configure Legacy TagLib
        run: |
          set -euxo pipefail

          cmake \
            -S taglib_src \
            -B taglib_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/taglib_install"

      - name: Build and Install Legacy TagLib
        run: |
          set -euxo pipefail

          cmake \
            --build taglib_build \
            --config Release \
            --parallel 4

          cmake \
            --install taglib_build \
            --config Release

      - name: Verify Legacy TagLib Installation
        run: |
          set -euxo pipefail

          echo "TagLib installation:"
          find "${{ github.workspace }}/taglib_install" -maxdepth 4 -type f | sort

      - name: Verify Qt5Keychain Package
        run: |
          set -euxo pipefail

          QTKEYCHAIN_PREFIX="${{ github.workspace }}/qtkeychain_install"

          echo "Searching for Qt5Keychain CMake package files..."

          find "${QTKEYCHAIN_PREFIX}" \
            -type f \
            \( \
              -name "Qt5KeychainConfig.cmake" \
              -o -name "qt5keychain-config.cmake" \
            \) \
            -print

          if ! find "${QTKEYCHAIN_PREFIX}" \
            -type f \
            \( \
              -name "Qt5KeychainConfig.cmake" \
              -o -name "qt5keychain-config.cmake" \
            \) \
            | grep -q .; then
            echo "ERROR: Qt5Keychain CMake package configuration was not installed."
            exit 1
          fi

          echo "Qt5Keychain CMake package found."

      - name: Configure Mixxx CMake Project
        run: |
          set -euxo pipefail

          rm -rf build

          QT_PREFIX="${{ github.workspace }}/qt/Qt/5.15.2/macos"
          TAGLIB_PREFIX="${{ github.workspace }}/taglib_install"
          QTKEYCHAIN_PREFIX="${{ github.workspace }}/qtkeychain_install"

          export PKG_CONFIG_PATH="${TAGLIB_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          export CMAKE_PREFIX_PATH="${QT_PREFIX};${QTKEYCHAIN_PREFIX};${TAGLIB_PREFIX};${CMAKE_PREFIX_PATH:-}"

          echo "CMAKE_PREFIX_PATH:"
          echo "$CMAKE_PREFIX_PATH"

          echo "Qt5:"
          qmake -v

          echo "Qt5Keychain CMake files:"
          find "${QTKEYCHAIN_PREFIX}" \
            -type f \
            \( \
              -name "Qt5KeychainConfig.cmake" \
              -o -name "qt5keychain-config.cmake" \
            \) \
            -print

          cmake \
            -S source_repo/source \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_PREFIX_PATH="${QT_PREFIX};${QTKEYCHAIN_PREFIX};${TAGLIB_PREFIX}" \
            -DTESTING=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCH=OFF \
            -DOPTIMIZE=portable

      - name: Build Mixxx Application
        run: |
          set -euxo pipefail

          cmake \
            --build build \
            --config Release \
            --parallel 4
       - name: Create macOS DMG
        run: |
          set -euxo pipefail

          cd build

          cpack \
            -G DragNDrop \
            -C Release

          echo "Generated packages:"

          find . -maxdepth 2 -type f \
            \( \
              -name "*.dmg" \
              -o \
              -name "*.pkg" \
              -o \
              -name "*.tar.gz" \
            \) \
            -print

      - name: Verify DMG
        run: |
          set -euxo pipefail

          DMG_COUNT=$(find build -type f -name "*.dmg" | wc -l | tr -d ' ')

          if [ "$DMG_COUNT" -eq 0 ]; then
            echo "ERROR: No DMG was created."
            exit 1
          fi

          echo "DMG successfully created:"

          find build -type f -name "*.dmg" -print

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: MIXXX2.4-VIDEO-BACKPORT-macos-intel-DMG
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 7
          
      - name: Configure Mixxx CMake Project
        run: |
          set -euxo pipefail

          rm -rf build

          QT_PREFIX="${GITHUB_WORKSPACE}/qt/Qt/5.15.2/macos"
          QTKEYCHAIN_PREFIX="${GITHUB_WORKSPACE}/qtkeychain_install"

          cmake \
            -S source_repo/source \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX;$QTKEYCHAIN_PREFIX" \
            -DQt5Keychain_DIR="$QTKEYCHAIN_CMAKE_DIR" \
            -DTESTING=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCH=OFF \
            -DOPTIMIZE=portable

      - name: Build Mixxx Application
        run: |
          set -euxo pipefail

          cmake \
            --build build \
            --config Release \
            --parallel 4

      - name: Create macOS DMG
        run: |
          set -euxo pipefail

          cd build
          cpack -G DragNDrop -C Release

      - name: Verify DMG
        run: |
          set -euxo pipefail

          DMG_COUNT=$(find build -type f -name "*.dmg" | wc -l | tr -d ' ')

          if [ "$DMG_COUNT" -eq 0 ]; then
            echo "ERROR: No DMG was created."
            exit 1
          fi

          find build -type f -name "*.dmg" -print

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: MIXXX2.4-VIDEO-BACKPORT-macos-intel-DMG
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 7
