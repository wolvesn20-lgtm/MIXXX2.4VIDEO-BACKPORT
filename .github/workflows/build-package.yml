name: CMake Cloud Build and Package Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 360

    steps:
      - name: Checkout Primary Repository Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: source_repo

      - name: Locate helper scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scripts"
          for f in finalize_bundle.py check_sdk_symbols.py; do
            found="$(find source_repo -maxdepth 3 -name "$f" \
              -not -path 'source_repo/source/*' -not -path 'source_repo/.git/*' | head -1)"
            if [ -z "$found" ]; then
              echo "::error::$f is not in the repository. Commit it to .github/scripts/."
              exit 1
            fi
            echo "$f found at $found"
            cp "$found" "$RUNNER_TEMP/scripts/$f"
          done
          echo "SCRIPTS_DIR=$RUNNER_TEMP/scripts" >> "$GITHUB_ENV"

      - name: Verify repository files
        run: |
          set -euo pipefail
          problems=0
          wf="$(grep -l "CMake Cloud Build and Package Pipeline" source_repo/.github/workflows/*.y*ml 2>/dev/null | head -1 || true)"
          if [ -z "$wf" ]; then
            echo "::error::Could not find the workflow file in .github/workflows/"; exit 1
          fi
          for step in \
            "Build dependencies for macOS 10.13" \
            "Configure Mixxx CMake Project" \
            "Build Mixxx Application" \
            "Install Mixxx" \
            "Assemble Mixxx.app bundle" \
            "Bundle Qt frameworks with macdeployqt" \
            "Finalize bundle using strict 10.13 validation" \
            "Final symbol check against the macOS 10.13 SDK" \
            "Create DMG" \
            "Upload macOS DMG"; do
            if ! grep -q "name: $step" "$wf"; then
              echo "::error::The workflow file is incomplete: the step '$step' is missing."
              problems=1
            fi
          done
          triplet=source_repo/triplets/x64-osx-min1013-release.cmake
          if ! grep -q "VCPKG_OSX_DEPLOYMENT_TARGET 10.13" "$triplet" 2>/dev/null; then
            echo "::error::$triplet is missing or does not set VCPKG_OSX_DEPLOYMENT_TARGET 10.13"
            problems=1
          fi
          if [ "$problems" -ne 0 ]; then exit 1; fi
          echo "Workflow file, triplet and ports list are all complete."

      - name: Restore macOS 10.13 dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/deps-1013
          key: deps-1013-v4-${{ runner.os }}-${{ hashFiles('source_repo/triplets/*.cmake', 'source_repo/vcpkg-ports.txt') }}

      - name: Restore vcpkg binary cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-archives
          key: vcpkg-archives-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-archives-v1-${{ runner.os }}-

      - name: Build dependencies for macOS 10.13
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          set -f
          export VCPKG_DEFAULT_BINARY_CACHE="$GITHUB_WORKSPACE/vcpkg-archives"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          brew install nasm pkg-config autoconf automake libtool autoconf-archive
          mkdir -p "$RUNNER_TEMP/shims"
          GLT="$(command -v glibtoolize || true)"
          if [ -n "$GLT" ]; then ln -sf "$GLT" "$RUNNER_TEMP/shims/libtoolize"; fi
          export PATH="$RUNNER_TEMP/shims:$PATH:$(brew --prefix libtool)/libexec/gnubin"
          export LIBTOOLIZE=glibtoolize
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          PORTS=$(sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' source_repo/vcpkg-ports.txt | grep -v '^$' | tr '\n' ' ')
          bad_ports=0
          for p in $PORTS; do
            base="${p%%\[*}"
            if [ ! -d "$RUNNER_TEMP/vcpkg/ports/$base" ]; then
              echo "::error::vcpkg has no port named '$base'."
              bad_ports=1
            fi
          done
          if [ "$bad_ports" -ne 0 ]; then exit 1; fi
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg" install $PORTS \
            --overlay-triplets="$PWD/source_repo/triplets" \
            --triplet x64-osx-min1013-release \
            --x-install-root="$PWD/deps-1013" \
            --x-buildtrees-root="$RUNNER_TEMP/vcpkg-buildtrees" \
            --clean-after-build

          DEPS="$PWD/deps-1013/x64-osx-min1013-release"
          git clone --depth 1 --branch v21.12 https://github.com/protocolbuffers/protobuf.git "$RUNNER_TEMP/protobuf"
          cmake -S "$RUNNER_TEMP/protobuf/cmake" -B "$RUNNER_TEMP/protobuf/build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_RPATH=@loader_path/../lib \
            -Dprotobuf_BUILD_SHARED_LIBS=ON -Dprotobuf_BUILD_TESTS=OFF -Dprotobuf_WITH_ZLIB=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS"
          cmake --build "$RUNNER_TEMP/protobuf/build" --parallel
          cmake --install "$RUNNER_TEMP/protobuf/build"

          git clone --depth 1 --branch 2.2.8 https://github.com/mixxxdj/libkeyfinder.git "$RUNNER_TEMP/libkeyfinder"
          cmake -S "$RUNNER_TEMP/libkeyfinder" -B "$RUNNER_TEMP/libkeyfinder/build" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_PREFIX_PATH="$DEPS" -DCMAKE_INSTALL_PREFIX="$DEPS"
          cmake --build "$RUNNER_TEMP/libkeyfinder/build" --parallel
          cmake --install "$RUNNER_TEMP/libkeyfinder/build"

      - name: Save vcpkg binary cache
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-archives
          key: vcpkg-archives-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Check every dependency really targets macOS 10.13
        run: python3 "$SCRIPTS_DIR/finalize_bundle.py" --scan-dir "$GITHUB_WORKSPACE/deps-1013/x64-osx-min1013-release/lib" --min-macos 10.13

      - name: Check dependency inventory
        run: |
          set -uo pipefail
          DEPS="$GITHUB_WORKSPACE/deps-1013/x64-osx-min1013-release"
          LIB="$DEPS/lib"
          missing=0
          check() { label="$1"; shift; for pat in "$@"; do if ls "$LIB"/$pat >/dev/null 2>&1; then printf '  ok       %s\n' "$label"; return 0; fi; done; printf '  MISSING  %s\n' "$label"; missing=1; }
          check "ffmpeg: avcodec" 'libavcodec*.dylib'
          check "ffmpeg: avformat" 'libavformat*.dylib'
          check "ffmpeg: avutil" 'libavutil*.dylib'
          check "ffmpeg: swscale" 'libswscale*.dylib'
          check "ffmpeg: swresample" 'libswresample*.dylib'
          check "FLAC" 'libFLAC.*dylib'
          check "ogg" 'libogg*.dylib'
          check "vorbis" 'libvorbis.*dylib'
          check "vorbisenc" 'libvorbisenc*.dylib'
          check "vorbisfile" 'libvorbisfile*.dylib'
          check "opus" 'libopus*.dylib'
          check "mp3lame (LAME)" 'libmp3lame*.dylib' 'libmp3lame*.a'
          check "mpg123" 'libmpg123*.dylib'
          check "libsndfile" 'libsndfile*.dylib'
          check "libsamplerate" 'libsamplerate*.dylib'
          check "SoundTouch" 'libSoundTouch*.dylib'
          check "rubberband" 'librubberband*.dylib'
          check "chromaprint" 'libchromaprint*.dylib'
          check "ebur128" 'libebur128*.dylib'
          check "fftw3" 'libfftw3*.dylib'
          check "hidapi" 'libhidapi*.dylib'
          check "libusb" 'libusb*.dylib'
          check "portaudio" 'libportaudio*.dylib'
          check "portmidi" 'libportmidi*.dylib'
          check "protobuf" 'libprotobuf.*dylib'
          check "protobuf-lite" 'libprotobuf-lite*.dylib'
          check "libkeyfinder" 'libkeyfinder*.dylib'
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Save macOS 10.13 dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/deps-1013
          key: deps-1013-v4-${{ runner.os }}-${{ hashFiles('source_repo/triplets/*.cmake', 'source_repo/vcpkg-ports.txt') }}

      - name: Restore macOS 10.13 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/MacOSX10.13.sdk
          key: macosx-1013-sdk-v1

      - name: Download macOS 10.13 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          SDK_1013_URL: ${{ vars.SDK_1013_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk-dl" && cd "$RUNNER_TEMP/sdk-dl"
          urls="${SDK_1013_URL:-} https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.13.sdk.tar.xz https://github.com/phracker/MacOSX-SDKs/releases/download/10.15/MacOSX10.13.sdk.tar.xz"
          for url in $urls; do
            if curl -fsSL --retry 3 -o sdk.tar.xz "$url"; then break; fi
            rm -f sdk.tar.xz
          done
          if [ ! -s sdk.tar.xz ]; then exit 1; fi
          tar -xf sdk.tar.xz
          mv MacOSX10.13.sdk "$GITHUB_WORKSPACE/MacOSX10.13.sdk"

      - name: Check dependency symbols against the macOS 10.13 SDK
        run: python3 "$SCRIPTS_DIR/check_sdk_symbols.py" --sdk "$GITHUB_WORKSPACE/MacOSX10.13.sdk" "$GITHUB_WORKSPACE/deps-1013/x64-osx-min1013-release/lib"

      - name: Remove Test-Only moc Source from Mixxx Library
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cmake_file = Path("source_repo/source/CMakeLists.txt")
          lines = cmake_file.read_text().splitlines(keepends=True)
          target_line = "  src/util/moc_included_test.cpp\n"
          indexes = [i for i, line in enumerate(lines) if line == target_line]
          if len(indexes) == 2:
              del lines[indexes[0]]
              cmake_file.write_text("".join(lines))
          PY

      - name: Neutralize moc_included_test #error guard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target = Path("source_repo/source/src/util/moc_included_test.cpp")
          if target.exists():
              text = target.read_text()
              marker = "#error mocs_compilation.cpp not empty."
              if marker in text and not text.startswith("// " + marker):
                  text = text.replace(marker, "// " + marker, 1)
                  target.write_text(text)
          PY

      - name: Install Compatible CMake
        run: |
          set -euo pipefail
          brew uninstall --ignore-dependencies cmake || true
          curl -L https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-macos-universal.tar.gz -o /tmp/cmake.tar.gz
          sudo tar -xzf /tmp/cmake.tar.gz -C /usr/local
          CMAKE_DIR="/usr/local/cmake-3.28.6-macos-universal/CMake.app/Contents/bin"
          echo "$CMAKE_DIR" >> "$GITHUB_PATH"
          export PATH="$CMAKE_DIR:$PATH"

      - name: Remove conflicting OpenSSL 1.1 link
        run: |
          set -euo pipefail
          brew unlink openssl@1.1 || true
          if [ -L "/usr/local/bin/openssl" ] && readlink "/usr/local/bin/openssl" | grep -q "openssl@1.1"; then rm -f "/usr/local/bin/openssl"; fi

      - name: Install Remaining Core Mixxx Dependencies
        run: |
          set -euo pipefail
          brew update
          brew install googletest boost cpp-gsl pkg-config

      - name: Install macdeployqt via Homebrew
        run: |
          set -euo pipefail
          brew install qt@5 || true
          QTBIN="/usr/local/opt/qt@5/bin"
          if [ -x "$QTBIN/macdeployqt" ]; then echo "$QTBIN" >> "$GITHUB_PATH"; fi

      - name: Set Up Qt5 Environment
        uses: jurplel/install-qt-action@v4
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          version: "5.15.2"
          host: "mac"
          target: "desktop"
          dir: "${{ github.workspace }}/qt"
          setup-python: true

      - name: Build Qt5Keychain
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 0.15.0 https://github.com/frankosterfeld/qtkeychain.git qtkeychain_src
          WORKSPACE="${GITHUB_WORKSPACE}"
          QT_PREFIX="$WORKSPACE/qt/Qt/5.15.2/macos"
          QTKEYCHAIN_PREFIX="$WORKSPACE/qtkeychain_install"
          cmake -S qtkeychain_src -B qtkeychain_build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" -DCMAKE_INSTALL_PREFIX="$QTKEYCHAIN_PREFIX" \
            -DBUILD_WITH_QT6=OFF -DBUILD_TRANSLATIONS=OFF -DBUILD_TESTING=OFF
          cmake --build qtkeychain_build --config Release --parallel 4
          cmake --install qtkeychain_build --config Release

      - name: Checkout TagLib 1.11.1
        uses: actions/checkout@v4
        with:
          repository: taglib/taglib
          ref: v1.11.1
          path: taglib_src

      - name: Build TagLib
        run: |
          set -euo pipefail
          cmake -S taglib_src -B taglib_build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/taglib_install"
          cmake --build taglib_build --config Release --parallel 4
          cmake --install taglib_build --config Release

      - name: Configure Mixxx CMake Project
        run: |
          set -euo pipefail
          rm -rf build
          DEPS="$GITHUB_WORKSPACE/deps-1013/x64-osx-min1013-release"
          QT_PREFIX="${GITHUB_WORKSPACE}/qt/Qt/5.15.2/macos"
          QTKEYCHAIN_PREFIX="${GITHUB_WORKSPACE}/qtkeychain_install"
          TAGLIB_PREFIX="${GITHUB_WORKSPACE}/taglib_install"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig:$DEPS/share/pkgconfig:${TAGLIB_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="$DEPS;${QT_PREFIX};${QTKEYCHAIN_PREFIX};${TAGLIB_PREFIX}"
          SWSCALE_LDFLAGS="$(pkg-config --libs libswscale 2>/dev/null || true)"
          if [ -z "$SWSCALE_LDFLAGS" ]; then SWSCALE_LDFLAGS="-L$DEPS/lib -lswscale"; fi
          LAME_LIB="$(ls "$DEPS"/lib/libmp3lame*.dylib "$DEPS"/lib/libmp3lame*.a 2>/dev/null | head -1 || true)"
          LAME_FLAGS=""
          if [ -n "$LAME_LIB" ] && [ -f "$DEPS/include/lame/lame.h" ]; then LAME_FLAGS="-Dmp3lame_LIBRARY=$LAME_LIB -Dmp3lame_INCLUDE_DIR=$DEPS/include"; fi
          QT5KEYCHAIN_CONFIG="$(find "${QTKEYCHAIN_PREFIX}" -type f \( -name "Qt5KeychainConfig.cmake" -o -name "qt5keychain-config.cmake" \) -print -quit)"
          QT5KEYCHAIN_DIR="$(dirname "$QT5KEYCHAIN_CONFIG")"
          cmake -S source_repo/source -B build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/build/install" \
            -DCMAKE_EXE_LINKER_FLAGS="-framework AudioToolbox -framework AppKit -framework CoreVideo -framework CoreMedia ${SWSCALE_LDFLAGS}" \
            -DCMAKE_CXX_FLAGS="-idirafter /usr/local/include" \
            -DTESTING=OFF -DBUILD_TESTING=OFF -DBUILD_BENCH=OFF -DOPTIMIZE=portable \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" -DQt5Keychain_DIR="$QT5KEYCHAIN_DIR" $LAME_FLAGS

      - name: Build Mixxx Application
        run: cmake --build build --config Release --parallel 4

      - name: Install Mixxx
        run: cmake --install build --config Release

      - name: Assemble Mixxx.app bundle
        run: |
          set -euo pipefail
          WORKSPACE="${GITHUB_WORKSPACE}"
          INSTALL_DIR="${WORKSPACE}/build/install"
          APP="${WORKSPACE}/build/Phoenix.app"

          if [ ! -f "${INSTALL_DIR}/bin/mixxx" ]; then exit 1; fi
          rm -rf "$APP"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources" "${APP}/Contents/Frameworks"

          cp "${INSTALL_DIR}/bin/mixxx" "${APP}/Contents/MacOS/mixxx"
          chmod +x "${APP}/Contents/MacOS/mixxx"
          if [ -d "${INSTALL_DIR}/share/mixxx" ]; then cp -R "${INSTALL_DIR}/share/mixxx/." "${APP}/Contents/Resources/"; fi

          cat > "${APP}/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>Phoenix</string>
              <key>CFBundleDisplayName</key><string>Phoenix</string>
              <key>CFBundleIdentifier</key><string>org.nightwolves.Phoenix</string>
              <key>CFBundleVersion</key><string>2.4.2</string>
              <key>CFBundleShortVersionString</key><string>2.4.2</string>
              <key>CFBundleExecutable</key><string>mixxx</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleSignature</key><string>????</string>
              <key>LSMinimumSystemVersion</key><string>10.13</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>NSMicrophoneUsageDescription</key>
              <string>Phoenix needs microphone access for recording and broadcasting.</string>
              <key>CFBundleIconFile</key><string>phoenix.icns</string>
          </dict>
          </plist>
          PLIST

          mkdir -p "${APP}/Contents/Resources/skins/Phoenix/images"
          if [ -f "${WORKSPACE}/source_repo/res/skins/Phoenix/images/phoenix_logo.svg" ]; then
            cp "${WORKSPACE}/source_repo/res/skins/Phoenix/images/phoenix_logo.svg" "${APP}/Contents/Resources/skins/Phoenix/images/"
          fi
          echo "MXXX_APP_PATH=${APP}" >> "$GITHUB_ENV"

      - name: Bundle Qt frameworks with macdeployqt
        run: |
          set -euo pipefail
          APP="${MXXX_APP_PATH}"
          DEPS="$GITHUB_WORKSPACE/deps-1013/x64-osx-min1013-release"
          MACDEPLOYQT="$(command -v macdeployqt || true)"
          if [ -z "$MACDEPLOYQT" ]; then MACDEPLOYQT="$(find /usr/local -name macdeployqt -type f 2>/dev/null | head -1)"; fi
          "$MACDEPLOYQT" "$APP" -verbose=2 \
            -libpath="$DEPS/lib" -libpath="${{ github.workspace }}/qtkeychain_install/lib" \
            -libpath=/usr/local/lib -libpath=/usr/local/opt/qt@5/lib \
            -libpath="${{ github.workspace }}/qt/Qt/5.15.2/macos/lib" || true

      - name: Remove unneeded SQL drivers and the libraries they pulled in
        run: |
          set -euo pipefail
          APP="${MXXX_APP_PATH}"
          if [ -d "$APP/Contents/PlugIns/sqldrivers" ]; then
            find "$APP/Contents/PlugIns/sqldrivers" -type f ! -name 'libqsqlite.dylib' -print -delete
          fi
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, os.environ["SCRIPTS_DIR"])
          from finalize_bundle import bundle_machos
          app = os.environ["MXXX_APP_PATH"]
          fw = os.path.join(app, "Contents", "Frameworks")
          files = {p: info for p, info in bundle_machos(app)}
          by_name = {}
          for name in os.listdir(fw):
              p = os.path.join(fw, name)
              real = os.path.realpath(p)
              if real in files and os.path.dirname(real) == os.path.realpath(fw): by_name[name] = real
          roots = [p for p in files if os.path.dirname(p) != os.path.realpath(fw)]
          seen, queue = set(roots), list(roots)
          while queue:
              p = queue.pop()
              for _kind, dep in files[p]["deps"]:
                  q = by_name.get(os.path.basename(dep))
                  if q and q not in seen:
                      seen.add(q); queue.append(q)
          unused = sorted({real for real in by_name.values() if real not in seen})
          for real in unused: os.remove(real)
          for name in os.listdir(fw):
              p = os.path.join(fw, name)
              if os.path.islink(p) and not os.path.exists(p): os.remove(p)
          PY

      - name: Finalize bundle using strict 10.13 validation
        run: |
          python3 "$SCRIPTS_DIR/finalize_bundle.py" "$MXXX_APP_PATH" \
            --qt-dir "${{ github.workspace }}/qt/Qt/5.15.2/macos" \
            --search "$GITHUB_WORKSPACE/deps-1013/x64-osx-min1013-release/lib" \
            --search "${GITHUB_WORKSPACE}/qtkeychain_install/lib" \
            --min-macos 10.13

      - name: Explain which files need the too-new libraries
        if: failure()
        run: |
          if [ -z "${MXXX_APP_PATH:-}" ] || [ ! -d "$MXXX_APP_PATH" ]; then exit 0; fi
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, os.environ["SCRIPTS_DIR"])
          from finalize_bundle import bundle_machos, target_info
          app = os.environ["MXXX_APP_PATH"]
          files = {p: i for p, i in bundle_machos(app)}
          bad = []
          for p in files:
              minos, chained = target_info(p)
              if (minos and minos > (10, 13)) or chained: bad.append((p, minos, chained))
          print("Files built for a newer macOS than 10.13, or using chained fixups:")
          for p, minos, chained in sorted(bad):
              base = os.path.basename(p)
              users = sorted(os.path.relpath(q, app) for q, i in files.items() if q != p and any(os.path.basename(d) == base for _k, d in i["deps"]))
              needs = [d for _k, d in files[p]["deps"] if not d.startswith(("/usr/lib/", "/System/"))]
              print("  %s (macOS %s%s)" % (os.path.relpath(p, app), "%d.%d" % minos if minos else "?", ", chained fixups" if chained else ""))
          PY

      - name: Final symbol check against the macOS 10.13 SDK
        run: python3 "$SCRIPTS_DIR/check_sdk_symbols.py" --sdk "$GITHUB_WORKSPACE/MacOSX10.13.sdk" "$MXXX_APP_PATH"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          set -euo pipefail
          APP="${MXXX_APP_PATH}"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then exit 1; fi
          OUT="Phoenix-Night-Wolves-macOS-10.13.dmg"
          rm -f "$OUT"
          create-dmg \
            --volname "Phoenix - Night Wolves" \
            --window-pos 200 120 --window-size 600 400 --icon-size 100 \
            --app-drop-link 450 185 "$OUT" "$APP" || true
          ls -lh "$OUT"

      - name: Upload macOS DMG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Night-Wolves-macOS-Intel-DMG
