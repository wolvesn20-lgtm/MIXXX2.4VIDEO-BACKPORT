name: CMake Cloud Build and Package Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15-intel

    steps:
      - name: Checkout Primary Repository Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: source_repo

      - name: Install Compatible CMake
        run: |
          set -euxo pipefail

          brew uninstall --ignore-dependencies cmake || true

          curl -L \
            https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-macos-universal.tar.gz \
            -o /tmp/cmake.tar.gz

          sudo tar -xzf /tmp/cmake.tar.gz -C /usr/local

          CMAKE_DIR="/usr/local/cmake-3.28.6-macos-universal/CMake.app/Contents/bin"

          echo "$CMAKE_DIR" >> "$GITHUB_PATH"
          export PATH="$CMAKE_DIR:$PATH"

          cmake --version

      - name: Remove conflicting OpenSSL 1.1 link
        run: |
          set -euxo pipefail

          brew unlink openssl@1.1 || true

          if [ -L "/usr/local/bin/openssl" ] && readlink "/usr/local/bin/openssl" | grep -q "openssl@1.1"; then
            rm -f "/usr/local/bin/openssl"
          fi

      - name: Install All Core Mixxx Dependencies
        run: |
          set -euxo pipefail

          brew update

          brew install \
            ffmpeg \
            googletest \
            chromaprint \
            google-benchmark \
            libebur128 \
            fftw \
            libkeyfinder \
            flac \
            libvorbis \
            sound-touch \
            portaudio \
            hidapi \
            portmidi \
            protobuf \
            rubberband \
            boost \
            cpp-gsl \
            pkg-config

      - name: Set Up Qt5 Environment
        uses: jurplel/install-qt-action@v4
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          version: "5.15.2"
          host: "mac"
          target: "desktop"
          dir: "${{ github.workspace }}/qt"
          setup-python: true

      - name: Build Qt5Keychain
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch 0.15.0 \
            https://github.com/frankosterfeld/qtkeychain.git \
            qtkeychain_src

          QT_PREFIX="${{ github.workspace }}/qt/Qt/5.15.2/macos"
          QTKEYCHAIN_PREFIX="${{ github.workspace }}/qtkeychain_install"

          cmake \
            -S qtkeychain_src \
            -B qtkeychain_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_PREFIX}" \
            -DCMAKE_INSTALL_PREFIX="${QTKEYCHAIN_PREFIX
