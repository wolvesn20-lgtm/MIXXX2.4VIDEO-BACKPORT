name: CMake Cloud Build and Package Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15-intel

    steps:
      - name: Checkout Primary Repository Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: source_repo

      - name: Install Compatible CMake
        run: |
          set -euxo pipefail

          brew uninstall --ignore-dependencies cmake || true

          curl -L \
            https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-macos-universal.tar.gz \
            -o /tmp/cmake.tar.gz

          sudo tar -xzf /tmp/cmake.tar.gz -C /usr/local

          CMAKE_DIR="/usr/local/cmake-3.28.6-macos-universal/CMake.app/Contents/bin"

          echo "$CMAKE_DIR" >> "$GITHUB_PATH"
          export PATH="$CMAKE_DIR:$PATH"

          cmake --version

      - name: Remove conflicting OpenSSL 1.1 link
        run: |
          set -euxo pipefail

          brew unlink openssl@1.1 || true

          if [ -L "/usr/local/bin/openssl" ] && readlink "/usr/local/bin/openssl" | grep -q "openssl@1.1"; then
            rm -f "/usr/local/bin/openssl"
          fi

      - name: Install All Core Mixxx Dependencies
        run: |
          set -euxo pipefail

          brew update

          brew install \
            ffmpeg \
            googletest \
            chromaprint \
            google-benchmark \
            libebur128 \
            fftw \
            libkeyfinder \
            flac \
            libvorbis \
            sound-touch \
            portaudio \
            hidapi \
            portmidi \
            protobuf \
            rubberband \
            boost \
            pkg-config
      
          
       - name: Set Up Qt5 Environment
        uses: jurplel/install-qt-action@v4
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          version: "5.15.2"
          host: "mac"
          target: "desktop"
          dir: "${{ github.workspace }}/qt"
          setup-python: true
          
      - name: Clone Legacy TagLib 1.11.1 Source
        uses: actions/checkout@v4
        with:
          repository: taglib/taglib
          ref: v1.11.1
          path: taglib_src

      - name: Configure Legacy TagLib
        run: |
          set -euxo pipefail

          cmake \
            -S taglib_src \
            -B taglib_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/taglib_install"

      - name: Build and Install Legacy TagLib
        run: |
          set -euxo pipefail

          cmake \
            --build taglib_build \
            --config Release \
            --parallel 4

          cmake \
            --install taglib_build \
            --config Release

      - name: Verify Legacy TagLib Installation
        run: |
          set -euxo pipefail

          echo "TagLib installation:"
          find "${{ github.workspace }}/taglib_install" -maxdepth 4 -type f | sort

      - name: Configure Mixxx CMake Project
        run: |
          set -euxo pipefail

          QT_PREFIX="${{ github.workspace }}/qt/Qt/5.15.2/macos"
          TAGLIB_PREFIX="${{ github.workspace }}/taglib_install"

          export PKG_CONFIG_PATH="${TAGLIB_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          cmake \
            -S source_repo/source \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_PREFIX_PATH="${QT_PREFIX}/lib/cmake;${TAGLIB_PREFIX}" \
            -DTESTING=OFF \
            -DBUILD_TESTING=OFF \
            -DOPTIMIZE=portable

      - name: Build Mixxx Application
        run: |
          set -euxo pipefail

          cmake \
            --build build \
            --config Release \
            --parallel 4

      - name: Create macOS DMG
        run: |
          set -euxo pipefail

          cd build

          cpack \
            -G DragNDrop \
            -C Release

          echo "Generated packages:"
          find . -maxdepth 2 -type f \( -name "*.dmg" -o -name "*.pkg" -o -name "*.tar.gz" \) -print

      - name: Verify DMG
        run: |
          set -euxo pipefail

          DMG_COUNT=$(find build -type f -name "*.dmg" | wc -l | tr -d ' ')

          if [ "$DMG_COUNT" -eq 0 ]; then
            echo "ERROR: No DMG was created."
            exit 1
          fi

          echo "DMG successfully created:"
          find build -type f -name "*.dmg" -print

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: MIXXX2.4-VIDEO-BACKPORT-macos-intel-DMG
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 7
