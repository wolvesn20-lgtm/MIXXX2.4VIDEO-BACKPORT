name: CMake Cloud Build and Package Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15-intel

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install All Core Mixxx Dependencies
      run: |
        echo "Installing core libraries, codecs, and final framework dependencies..."
        # UPDATED: Switched 'taglib@1' back to 'taglib' to pass the Homebrew download step
        brew install ffmpeg googletest chromaprint google-benchmark libebur128 fftw libkeyfinder flac libvorbis sound-touch taglib portaudio hidapi portmidi protobuf rubberband pkg-config

    - name: Set Up Qt5 Environment
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'mac'
        target: 'desktop'
        dir: '${{ github.workspace }}/qt'

    - name: Configure CMake Project for High Sierra
      run: |
        echo "Configuring project and overriding version limits..."
        # OVERRIDE: Replaced the path variable with a direct internal script modification to skip the TagLib 2.x gate
        sed -i '' 's/Version >= 1.11 and < 2.0/Version >= 1.11/g' source/CMakeLists.txt || true
        
        cmake -B build -S source \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
          -DTESTING=OFF \
          -DBUILD_TESTING=OFF \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR/lib/cmake"

    - name: Compile and Build Application
      run: |
        cmake --build build --config Release --parallel 4

    - name: Package and Upload Completed Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MIXXX2.4-VIDEO-BACKPORT-BUILD
        path: build/
        retention-days: 7
