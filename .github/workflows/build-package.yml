name: CMake Cloud Build and Package Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15-intel

    steps:
    - name: Checkout Primary Repository Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        path: source_repo

    - name: Checkout Legacy TagLib 1.11.1
      uses: actions/checkout@v4
      with:
        repository: taglib/taglib
        ref: v1.11.1
        path: taglib_src

    - name: Install Core Mixxx Dependencies
      run: |
        echo "Installing core libraries and frameworks..."
        brew install ffmpeg googletest chromaprint google-benchmark libebur128 fftw libkeyfinder flac libvorbis sound-touch portaudio hidapi portmidi protobuf rubberband pkg-config

    - name: Set Up Qt5 Environment
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'mac'
        target: 'desktop'
        dir: '${{ github.workspace }}/qt'

    - name: Compile Legacy TagLib 1.11.1 from Source
      run: |
        echo "Building legacy TagLib 1.x branch..."
        cd taglib_src
        # UPDATED: Added -DCMAKE_POLICY_VERSION_MINIMUM=3.5 to bypass the legacy policy enforcement restriction
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/taglib_local
        cmake --build build --parallel 4
        cmake --install build

    - name: Configure CMake Project for High Sierra
      run: |
        echo "Configuring project pointing to the local legacy TagLib build..."
        cmake -B build -S source_repo/source \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
          -DTESTING=OFF \
          -DBUILD_TESTING=OFF \
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/qt/Qt/5.15.2/macos/lib/cmake;${{ github.workspace }}/taglib_local"

    - name: Compile and Build Application
      run: |
        cmake --build build --config Release --parallel 4

    - name: Package and Upload Completed Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MIXXX2.4-VIDEO-BACKPORT-BUILD
        path: build/
        retention-days: 7


