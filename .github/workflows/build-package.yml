name: CMake Cloud Build and Package Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15-intel

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install FFmpeg and Build Prerequisites
      run: |
        brew install ffmpeg pkg-config

    - name: Set Up Qt5 Environment
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'mac'
        target: 'desktop'
        dir: '${{ github.workspace }}/qt'

    - name: Configure CMake Project for High Sierra
      run: |
        echo "Directing CMake to look inside the nested source folder..."
        # UPDATED: Changed source target from '.' to 'source' to match your repository layout
        cmake -B build -S source \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR/lib/cmake"

    - name: Compile and Build Application
      run: |
        cmake --build build --config Release --parallel 4

    - name: Package and Upload Completed Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MIXXX2.4-VIDEO-BACKPORT-BUILD
        path: build/
        retention-days: 7



         
