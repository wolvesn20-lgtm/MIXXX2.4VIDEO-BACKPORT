name: CMake Cloud Build and Package Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-macos-intel:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies via Homebrew
        run: |
          brew update
          # Install portmidi explicitly along with other Mixxx dependencies
          brew install portmidi chromaprint libebur128 libkeyfinder flac portaudio libogg libvorbis

      - name: Configure CMake Project
        run: |
          mkdir -p build
          cmake -B build \
            -DCMAKE_PREFIX_PATH="/usr/local" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPTIMIZATION=portable

      - name: Build Project
        run: |
          cmake --build build --config Release









