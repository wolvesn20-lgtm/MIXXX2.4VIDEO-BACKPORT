name: CMake Cloud Buildname: CMake Cloud Build and Package Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15-intel

    steps:
      - name: Checkout Primary Repository Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: source_repo

      - name: Remove Test-Only moc Source from Mixxx Library
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cmake_file = Path("source_repo/source/CMakeLists.txt")
          lines = cmake_file.read_text().splitlines(keepends=True)
          target_line = "  src/util/moc_included_test.cpp\n"
          indexes = [i for i, line in enumerate(lines) if line == target_line]
          if len(indexes) != 2:
              raise SystemExit(
                  f"ERROR: Expected exactly 2 moc_included_test.cpp entries, "
                  f"found {len(indexes)}")
          del lines[indexes[0]]
          cmake_file.write_text("".join(lines))
          print("Removed moc_included_test.cpp from mixxx-lib.")
          PY
          grep -n "^[[:space:]]*src/util/moc_included_test.cpp[[:space:]]*$" \
            source_repo/source/CMakeLists.txt
          COUNT="$(grep -c "^[[:space:]]*src/util/moc_included_test.cpp[[:space:]]*$" \
              source_repo/source/CMakeLists.txt || true)"
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one remaining moc_included_test.cpp source entry."
            exit 1
          fi
          echo "Source patch verification successful."

      - name: Neutralize moc_included_test #error guard
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target = Path("source_repo/source/src/util/moc_included_test.cpp")
          if not target.exists():
              raise SystemExit(f"ERROR: {target} not found")
          text = target.read_text()
          marker = "#error mocs_compilation.cpp not empty."
          if marker in text and not text.startswith("// " + marker):
              text = text.replace(marker, "// " + marker, 1)
              target.write_text(text)
              print("Neutralized #error guard.")
          else:
              print("Nothing to neutralize.")
          PY

      - name: Install Compatible CMake
        run: |
          set -euxo pipefail
          brew uninstall --ignore-dependencies cmake || true
          curl -L \
            https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-macos-universal.tar.gz \
            -o /tmp/cmake.tar.gz
          sudo tar -xzf /tmp/cmake.tar.gz -C /usr/local
          CMAKE_DIR="/usr/local/cmake-3.28.6-macos-universal/CMake.app/Contents/bin"
          echo "$CMAKE_DIR" >> "$GITHUB_PATH"
          export PATH="$CMAKE_DIR:$PATH"
          cmake --version

      - name: Remove conflicting OpenSSL 1.1 link
        run: |
          set -euxo pipefail
          brew unlink openssl@1.1 || true
          if [ -L "/usr/local/bin/openssl" ] && \
             readlink "/usr/local/bin/openssl" | grep -q "openssl@1.1"; then
            rm -f "/usr/local/bin/openssl"
          fi

      - name: Install All Core Mixxx Dependencies
        run: |
          set -euxo pipefail
          brew update
          brew install \
            ffmpeg googletest chromaprint google-benchmark \
            libebur128 fftw libkeyfinder flac libvorbis sound-touch \
            portaudio hidapi portmidi protobuf rubberband boost taglib \
            cpp-gsl pkg-config dylibbundler

      - name: Install macdeployqt via Homebrew
        run: |
          set -euxo pipefail
          brew install qt@5 || true
          QTBIN="/usr/local/opt/qt@5/bin"
          if [ -x "$QTBIN/macdeployqt" ]; then
            echo "Found macdeployqt at $QTBIN/macdeployqt"
            echo "$QTBIN" >> "$GITHUB_PATH"
          else
            echo "macdeployqt not found in qt@5; searching Homebrew prefix..."
            find /usr/local -name macdeployqt -type f 2>/dev/null || true
            exit 1
          fi

      - name: Set Up Qt5 Environment
        uses: jurplel/install-qt-action@v4
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          version: "5.15.2"
          host: "mac"
          target: "desktop"
          dir: "${{ github.workspace }}/qt"
          setup-python: true

      - name: Build Qt5Keychain
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 0.15.0 \
            https://github.com/frankosterfeld/qtkeychain.git qtkeychain_src
          WORKSPACE="${GITHUB_WORKSPACE}"
          QT_PREFIX="$WORKSPACE/qt/Qt/5.15.2/macos"
          QTKEYCHAIN_PREFIX="$WORKSPACE/qtkeychain_install"
          cmake -S qtkeychain_src -B qtkeychain_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$QTKEYCHAIN_PREFIX" \
            -DBUILD_WITH_QT6=OFF \
            -DBUILD_TRANSLATIONS=OFF \
            -DBUILD_TESTING=OFF
          cmake --build qtkeychain_build --config Release --parallel 4
          cmake --install qtkeychain_build --config Release

      - name: Clone Legacy TagLib 1.11.1 Source
        uses: actions/checkout@v4
        with:
          repository: taglib/taglib
          ref: v1.11.1
          path: taglib_src

      - name: Configure Legacy TagLib
        run: |
          set -euxo pipefail
          cmake -S taglib_src -B taglib_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/taglib_install"

      - name: Build and Install Legacy TagLib
        run: |
          set -euxo pipefail
          cmake --build taglib_build --config Release --parallel 4
          cmake --install taglib_build --config Release

      - name: Configure Mixxx CMake Project
        run: |
          set -euxo pipefail
          rm -rf build
          QT_PREFIX="${GITHUB_WORKSPACE}/qt/Qt/5.15.2/macos"
          TAGLIB_PREFIX="${GITHUB_WORKSPACE}/taglib_install"
          QTKEYCHAIN_PREFIX="${GITHUB_WORKSPACE}/qtkeychain_install"
          export PKG_CONFIG_PATH="${TAGLIB_PREFIX}/lib/pkgconfig"
          export CMAKE_PREFIX_PATH="${QT_PREFIX};${QTKEYCHAIN_PREFIX};${TAGLIB_PREFIX}"
          qmake -v

          SWSCALE_LDFLAGS="$(pkg-config --libs libswscale 2>/dev/null || echo '-lswscale')"
          echo "SWSCALE_LDFLAGS: $SWSCALE_LDFLAGS"

          QT5KEYCHAIN_CONFIG="$(
            find "${QTKEYCHAIN_PREFIX}" -type f \
              \( -name "Qt5KeychainConfig.cmake" -o -name "qt5keychain-config.cmake" \) \
              -print -quit
          )"
          if [ -z "$QT5KEYCHAIN_CONFIG" ]; then
            echo "ERROR: Qt5Keychain CMake package was not found."
            exit 1
          fi
          QT5KEYCHAIN_DIR="$(dirname "$QT5KEYCHAIN_CONFIG")"

          cmake -S source_repo/source -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/build/install" \
            -DCMAKE_EXE_LINKER_FLAGS="-framework AudioToolbox -framework AppKit ${SWSCALE_LDFLAGS}" \
            -DTESTING=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCH=OFF \
            -DOPTIMIZE=portable \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DQt5Keychain_DIR="$QT5KEYCHAIN_DIR"

      - name: Build Mixxx Application
        run: |
          set -euxo pipefail
          cmake --build build --config Release --parallel 4

      - name: Install Mixxx
        run: |
          set -euxo pipefail
          cmake --install build --config Release
          echo "=== Top-level contents of build/install ==="
          ls -la "${{ github.workspace }}/build/install"

      - name: Assemble Mixxx.app bundle
        run: |
          set -euxo pipefail
          WORKSPACE="${GITHUB_WORKSPACE}"
          INSTALL_DIR="${WORKSPACE}/build/install"
          APP="${WORKSPACE}/build/Mixxx.app"

          if [ ! -f "${INSTALL_DIR}/bin/mixxx" ]; then
            echo "ERROR: ${INSTALL_DIR}/bin/mixxx not found."
            ls -la "${INSTALL_DIR}/bin" || true
            exit 1
          fi

          rm -rf "$APP"
          mkdir -p "${APP}/Contents/MacOS"
          mkdir -p "${APP}/Contents/Resources"
          mkdir -p "${APP}/Contents/Frameworks"

          cp "${INSTALL_DIR}/bin/mixxx" "${APP}/Contents/MacOS/mixxx"
          chmod +x "${APP}/Contents/MacOS/mixxx"

          if [ -d "${INSTALL_DIR}/share/mixxx" ]; then
            cp -R "${INSTALL_DIR}/share/mixxx/." "${APP}/Contents/Resources/"
          fi

          cat > "${APP}/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>Mixxx</string>
              <key>CFBundleDisplayName</key><string>Mixxx</string>
              <key>CFBundleIdentifier</key><string>org.mixxx.Mixxx</string>
              <key>CFBundleVersion</key><string>2.4.2</string>
              <key>CFBundleShortVersionString</key><string>2.4.2</string>
              <key>CFBundleExecutable</key><string>mixxx</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleSignature</key><string>????</string>
              <key>LSMinimumSystemVersion</key><string>10.13</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>NSMicrophoneUsageDescription</key>
              <string>Mixxx needs microphone access for recording and broadcasting.</string>
              <key>CFBundleIconFile</key><string>mixxx.icns</string>
          </dict>
          </plist>
          PLIST

          ICON_SRC="${WORKSPACE}/source_repo/res/images/mixxx.icns"
          if [ -f "$ICON_SRC" ]; then
            cp "$ICON_SRC" "${APP}/Contents/Resources/mixxx.icns"
          fi

          echo "MXXX_APP_PATH=${APP}" >> "$GITHUB_ENV"

      - name: Bundle Qt frameworks with macdeployqt
        run: |
          set -euxo pipefail
          APP="${MXXX_APP_PATH}"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: MXXX_APP_PATH not set or invalid: '$APP'"
            exit 1
          fi
          MACDEPLOYQT="$(command -v macdeployqt || true)"
          if [ -z "$MACDEPLOYQT" ]; then
            MACDEPLOYQT="$(find /usr/local -name macdeployqt -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$MACDEPLOYQT" ] || [ ! -x "$MACDEPLOYQT" ]; then
            echo "ERROR: macdeployqt not found anywhere."
            find /usr/local -name macdeployqt 2>/dev/null || true
            find "${{ github.workspace }}/qt" -name macdeployqt 2>/dev/null || true
            exit 1
          fi
          echo "Using macdeployqt: $MACDEPLOYQT"
          "$MACDEPLOYQT" "$APP" -verbose=2 \
            -libpath=/usr/local/lib \
            -libpath=/usr/local/opt/qt@5/lib \
            -libpath="${{ github.workspace }}/qt/Qt/5.15.2/macos/lib"

      - name: Bundle non-Qt dependencies with dylibbundler
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          APP="${MXXX_APP_PATH}"
          MACOS_DIR="${APP}/Contents/MacOS"
          FW_DIR="${APP}/Contents/Frameworks"

          DYLIBBUNDLER="$(command -v dylibbundler || true)"
          if [ -z "$DYLIBBUNDLER" ]; then
            echo "ERROR: dylibbundler not found on PATH."
            exit 1
          fi
          echo "Using dylibbundler: $DYLIBBUNDLER"

          SEARCH_PATHS=(
            /usr/local/lib
            /usr/local/opt/ffmpeg/lib
            /usr/local/opt/taglib/lib
            /usr/local/opt/protobuf/lib
            /usr/local/opt/hidapi/lib
            /usr/local/opt/libusb/lib
            /usr/local/opt/libogg/lib
            /usr/local/opt/libvorbis/lib
            /usr/local/opt/openssl@3/lib
            /usr/local/opt/openssl@4/lib
            /usr/local/opt/rubberband/lib
            /usr/local/opt/libsndfile/lib
            /usr/local/opt/sound-touch/lib
            /usr/local/opt/portaudio/lib
            /usr/local/opt/portmidi/lib
            /usr/local/opt/flac/lib
            /usr/local/opt/libebur128/lib
            /usr/local/opt/libkeyfinder/lib
            /usr/local/opt/chromaprint/lib
            /usr/local/opt/lame/lib
            /usr/local/opt/boost/lib
            /usr/local/opt/fftw/lib
          )

          S_FLAGS=()
          for p in "${SEARCH_PATHS[@]}"; do
            if [ -d "$p" ]; then
              S_FLAGS+=(-s "$p")
            fi
          done

          echo "=== Running dylibbundler ONCE on the mixxx executable ==="
          "$DYLIBBUNDLER" \
            -od -b \
            -x "${MACOS_DIR}/mixxx" \
            -d "$FW_DIR" \
            -p "@executable_path/../Frameworks/" \
            "${S_FLAGS[@]}"

          echo "=== Contents of Frameworks after bundling ==="
          ls -la "$FW_DIR" | head -60

          echo "=== otool -L on mixxx (looking for Cellar/@rpath leaks) ==="
          otool -L "${MACOS_DIR}/mixxx" \
            | grep -E "(Cellar|/usr/local/opt|@rpath)" \
            || echo "(clean — no Cellar/@rpath references)"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          set -euxo pipefail
          APP="${MXXX_APP_PATH}"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: MXXX_APP_PATH not set or invalid: '$APP'"
            exit 1
          fi
          OUT="Mixxx-2.4-VIDEO-BACKPORT-macOS-10.13.dmg"
          rm -f "$OUT"
          create-dmg \
            --volname "Mixxx 2.4" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "$OUT" \
            "$APP" || true
          if [ ! -f "$OUT" ]; then
            echo "ERROR: DMG was not created."
            exit 1
          fi
          ls -lh "$OUT"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: MIXXX2.4-VIDEO-BACKPORT-macos-intel-DMG
          path: Mixxx-2.4-VIDEO-BACKPORT-macOS-10.13.dmg
          if-no-files-found: error
          retention-days: 7
          </dict>
          </plist>
          PLIST

          ICON_SRC="${WORKSPACE}/source_repo/res/images/mixxx.icns"
          if [ -f "$ICON_SRC" ]; then
            cp "$ICON_SRC" "${APP}/Contents/Resources/mixxx.icns"
          fi

          echo "MXXX_APP_PATH=${APP}" >> "$GITHUB_ENV"

      - name: Bundle Qt frameworks with macdeployqt
        run: |
          set -euxo pipefail
          APP="${MXXX_APP_PATH}"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: MXXX_APP_PATH not set or invalid: '$APP'"
            exit 1
          fi
          MACDEPLOYQT="$(command -v macdeployqt || true)"
          if [ -z "$MACDEPLOYQT" ]; then
            MACDEPLOYQT="$(find /usr/local -name macdeployqt -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$MACDEPLOYQT" ] || [ ! -x "$MACDEPLOYQT" ]; then
            echo "ERROR: macdeployqt not found anywhere."
            find /usr/local -name macdeployqt 2>/dev/null || true
            find "${{ github.workspace }}/qt" -name macdeployqt 2>/dev/null || true
            exit 1
          fi
          echo "Using macdeployqt: $MACDEPLOYQT"
          "$MACDEPLOYQT" "$APP" -verbose=2 \
            -libpath=/usr/local/lib \
            -libpath=/usr/local/opt/qt@5/lib \
            -libpath="${{ github.workspace }}/qt/Qt/5.15.2/macos/lib"

    - name: Bundle non-Qt dependencies with dylibbundler
       timeout-minutes: 15
       run: |
    set -euxo pipefail
    APP="${MXXX_APP_PATH}"
    MACOS_DIR="${APP}/Contents/MacOS"
    FW_DIR="${APP}/Contents/Frameworks"

    DYLIBBUNDLER="$(command -v dylibbundler || true)"
    if [ -z "$DYLIBBUNDLER" ]; then
      echo "ERROR: dylibbundler not found on PATH."
      exit 1
    fi
    echo "Using dylibbundler: $DYLIBBUNDLER"

    # Build the search path list once
    SEARCH_PATHS=(
      /usr/local/lib
      /usr/local/opt/ffmpeg/lib
      /usr/local/opt/taglib/lib
      /usr/local/opt/protobuf/lib
      /usr/local/opt/hidapi/lib
      /usr/local/opt/libusb/lib
      /usr/local/opt/libogg/lib
      /usr/local/opt/libvorbis/lib
      /usr/local/opt/openssl@3/lib
      /usr/local/opt/openssl@4/lib
      /usr/local/opt/rubberband/lib
      /usr/local/opt/libsndfile/lib
      /usr/local/opt/sound-touch/lib
      /usr/local/opt/portaudio/lib
      /usr/local/opt/portmidi/lib
      /usr/local/opt/flac/lib
      /usr/local/opt/libebur128/lib
      /usr/local/opt/libkeyfinder/lib
      /usr/local/opt/chromaprint/lib
      /usr/local/opt/lame/lib
      /usr/local/opt/boost/lib
      /usr/local/opt/fftw/lib
    )

    S_FLAGS=()
    for p in "${SEARCH_PATHS[@]}"; do
      if [ -d "$p" ]; then
        S_FLAGS+=(-s "$p")
      fi
    done

    echo "=== Running dylibbundler ONCE on the mixxx executable ==="
    "$DYLIBBUNDLER" \
      -od -b \
      -x "${MACOS_DIR}/mixxx" \
      -d "$FW_DIR" \
      -p "@executable_path/../Frameworks/" \
      "${S_FLAGS[@]}"

    echo "=== Contents of Frameworks after bundling ==="
    ls -la "$FW_DIR" | head -60

    echo "=== otool -L on mixxx (looking for Cellar/@rpath leaks) ==="
    otool -L "${MACOS_DIR}/mixxx" \
      | grep -E "(Cellar|/usr/local/opt|@rpath)" \
      || echo "(clean — no Cellar/@rpath references)"
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          set -euxo pipefail
          APP="${MXXX_APP_PATH}"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: MXXX_APP_PATH not set or invalid: '$APP'"
            exit 1
          fi
          OUT="Mixxx-2.4-VIDEO-BACKPORT-macOS-10.13.dmg"
          rm -f "$OUT"
          create-dmg \
            --volname "Mixxx 2.4" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "$OUT" \
            "$APP" || true
          if [ ! -f "$OUT" ]; then
            echo "ERROR: DMG was not created."
            exit 1
          fi
          ls -lh "$OUT"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: MIXXX2.4-VIDEO-BACKPORT-macos-intel-DMG
          path: Mixxx-2.4-VIDEO-BACKPORT-macOS-10.13.dmg
          if-no-files-found: error
          retention-days: 7
