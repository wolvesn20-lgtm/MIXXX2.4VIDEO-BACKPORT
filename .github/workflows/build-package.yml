name: CMake Cloud Build and Package Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15-intel

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout Primary Repository Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: source_repo

      # ------------------------------------------------------------
      # Fix moc_included_test.cpp placement
      # ------------------------------------------------------------
      - name: Fix moc_included_test.cpp Placement
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          cmake_file = Path("source_repo/source/CMakeLists.txt")
          text = cmake_file.read_text()

          target = "        src/util/moc_included_test.cpp\n"

          occurrences = text.count(target)

          if occurrences != 2:
              raise SystemExit(
                  f"ERROR: Expected exactly two source-list entries for "
                  f"moc_included_test.cpp before patch, found {occurrences}"
              )

          # Remove the first occurrence, which belongs to mixxx-lib.
          text = text.replace(target, "", 1)

          cmake_file.write_text(text)

          print("Removed moc_included_test.cpp from mixxx-lib.")
          print("Kept moc_included_test.cpp in mixxx-test.")
          PY

          echo "Verifying exact source-list entry..."
          grep -n "^[[:space:]]*src/util/moc_included_test.cpp[[:space:]]*$" \
            source_repo/source/CMakeLists.txt

          COUNT="$(grep -c \
            "^[[:space:]]*src/util/moc_included_test.cpp[[:space:]]*$" \
            source_repo/source/CMakeLists.txt || true)"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one remaining source-list entry."
            exit 1
          fi

          echo "moc_included_test.cpp patch verification successful."

      # ------------------------------------------------------------
      # Install known-compatible CMake
      # ------------------------------------------------------------
      - name: Install Compatible CMake
        run: |
          set -euxo pipefail

          brew uninstall --ignore-dependencies cmake || true

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o /tmp/cmake.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-macos-universal.tar.gz

          sudo rm -rf /usr/local/cmake-3.28.6-macos-universal

          sudo tar -xzf \
            /tmp/cmake.tar.gz \
            -C /usr/local

          CMAKE_DIR="/usr/local/cmake-3.28.6-macos-universal/CMake.app/Contents/bin"

          echo "$CMAKE_DIR" >> "$GITHUB_PATH"

          export PATH="$CMAKE_DIR:$PATH"

          cmake --version

      # ------------------------------------------------------------
      # OpenSSL cleanup
      # ------------------------------------------------------------
      - name: Prepare OpenSSL Environment
        run: |
          set -euxo pipefail

          brew unlink openssl@1.1 || true

          if [ -L /usr/local/bin/openssl ]; then
            TARGET="$(readlink /usr/local/bin/openssl || true)"

            if [ -n "$TARGET" ]; then
              echo "Removing conflicting OpenSSL symlink:"
              echo "/usr/local/bin/openssl -> $TARGET"
              sudo rm -f /usr/local/bin/openssl
            fi
          fi

      # ------------------------------------------------------------
      # Homebrew dependencies
      # ------------------------------------------------------------
      - name: Install Homebrew Dependencies
        run: |
          set -euxo pipefail

          brew update

          brew install \
            ffmpeg \
            googletest \
            chromaprint \
            google-benchmark \
            libebur128 \
            fftw \
            libkeyfinder \
            flac \
            libvorbis \
            sound-touch \
            portaudio \
            hidapi \
            portmidi \
            protobuf \
            rubberband \
            boost \
            taglib \
            cpp-gsl \
            pkg-config

      # ------------------------------------------------------------
      # Qt 5.15.2
      # ------------------------------------------------------------
      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          host: "mac"
          target: "desktop"
          arch: "clang_64"
          modules: ""
          cache: false

      # ------------------------------------------------------------
      # Qt5Keychain
      # ------------------------------------------------------------
      - name: Build Qt5Keychain
        run: |
          set -euxo pipefail

          export QT_PREFIX="${GITHUB_WORKSPACE}/qt/Qt/5.15.2/macos"
          export QTKEYCHAIN_PREFIX="${GITHUB_WORKSPACE}/qtkeychain_install"

          rm -rf qtkeychain
          rm -rf "$QTKEYCHAIN_PREFIX"

          git clone \
            --branch 0.15.0 \
            --depth 1 \
            https://github.com/frankosterfeld/qtkeychain.git

          cmake \
            -S qtkeychain \
            -B qtkeychain/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$QTKEYCHAIN_PREFIX" \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX"

          cmake \
            --build qtkeychain/build \
            --config Release \
            --parallel 4

          cmake \
            --install qtkeychain/build

      # ------------------------------------------------------------
      # Legacy TagLib 1.11.1
      # ------------------------------------------------------------
      - name: Build Legacy TagLib 1.11.1
        run: |
          set -euxo pipefail

          export TAGLIB_PREFIX="${GITHUB_WORKSPACE}/taglib_install"

          rm -rf taglib
          rm -rf "$TAGLIB_PREFIX"

          git clone \
            --branch v1.11.1 \
            --depth 1 \
            https://github.com/taglib/taglib.git

          cmake \
            -S taglib \
            -B taglib/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$TAGLIB_PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF

          cmake \
            --build taglib/build \
            --config Release \
            --parallel 4

          cmake \
            --install taglib/build

      # ------------------------------------------------------------
      # Dependency environment
      # ------------------------------------------------------------
      - name: Configure Dependency Environment
        run: |
          set -euxo pipefail

          export QT_PREFIX="${GITHUB_WORKSPACE}/qt/Qt/5.15.2/macos"
          export TAGLIB_PREFIX="${GITHUB_WORKSPACE}/taglib_install"
          export QTKEYCHAIN_PREFIX="${GITHUB_WORKSPACE}/qtkeychain_install"

          echo "QT_PREFIX=$QT_PREFIX" >> "$GITHUB_ENV"
          echo "TAGLIB_PREFIX=$TAGLIB_PREFIX" >> "$GITHUB_ENV"
          echo "QTKEYCHAIN_PREFIX=$QTKEYCHAIN_PREFIX" >> "$GITHUB_ENV"

          echo "PKG_CONFIG_PATH=${TAGLIB_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"

          echo "CMAKE_PREFIX_PATH=${QT_PREFIX};${QTKEYCHAIN_PREFIX};${TAGLIB_PREFIX}" >> "$GITHUB_ENV"

          echo "QT5KEYCHAIN_DIR=${QTKEYCHAIN_PREFIX}/lib/cmake/Qt5Keychain" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Verify Qt5Keychain
      # ------------------------------------------------------------
      - name: Verify Qt5Keychain Package
        run: |
          set -euxo pipefail

          echo "QT5KEYCHAIN_DIR=$QT5KEYCHAIN_DIR"

          if [ ! -f "$QT5KEYCHAIN_DIR/Qt5KeychainConfig.cmake" ]; then
            echo "ERROR: Qt5KeychainConfig.cmake was not found."
            find "$QTKEYCHAIN_PREFIX" \
              -name "Qt5KeychainConfig.cmake" \
              -o -name "qt5keychain-config.cmake" \
              -print
            exit 1
          fi

          echo "Qt5Keychain package found:"
          ls -la "$QT5KEYCHAIN_DIR"

      # ------------------------------------------------------------
      # Add AudioToolbox to dynamic macOS framework block
      # ------------------------------------------------------------
      - name: Add macOS AudioToolbox Framework
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          cmake_file = Path("source_repo/source/CMakeLists.txt")
          text = cmake_file.read_text()

          if '"-framework AudioToolbox"' in text:
              print("AudioToolbox framework already present.")
              raise SystemExit(0)

          target = '        "-weak_framework IOKit"\n'

          count = text.count(target)

          if count != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one dynamic macOS IOKit "
                  f"link entry, found {count}"
              )

          replacement = (
              '        "-weak_framework IOKit"\n'
              '        "-framework AudioToolbox"\n'
          )

          text = text.replace(target, replacement, 1)

          cmake_file.write_text(text)

          print(
              "Added AudioToolbox to the dynamic macOS "
              "mixxx-lib link block."
          )
          PY

          echo "Verifying AudioToolbox wiring..."

          grep -n -A6 -B3 '"-framework AudioToolbox"' \
            source_repo/source/CMakeLists.txt

          echo "AudioToolbox patch verification successful."

      # ------------------------------------------------------------
      # Configure Mixxx
      # ------------------------------------------------------------
      - name: Configure Mixxx
        run: |
          set -euxo pipefail

          rm -rf build

          cmake \
            -S source_repo/source \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DTESTING=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCH=OFF \
            -DOPTIMIZE=portable \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DQt5Keychain_DIR="$QT5KEYCHAIN_DIR"

      # ------------------------------------------------------------
      # Build Mixxx
      #
      # IMPORTANT:
      # Use one job temporarily so the FIRST real compiler/linker
      # failure cannot be hidden by parallel build output.
      # ------------------------------------------------------------
      - name: Build Mixxx Application
        run: |
          set -euxo pipefail

          export VERBOSE=1

          cmake \
            --build build \
            --config Release \
            --parallel 1 \
            --verbose

      # ------------------------------------------------------------
      # Package DMG
      # ------------------------------------------------------------
      - name: Package Mixxx DMG
        run: |
          set -euxo pipefail

          cd build

          cpack \
            -G DragNDrop \
            -C Release

      # ------------------------------------------------------------
      # Verify DMG
      # ------------------------------------------------------------
      - name: Verify DMG Artifact
        run: |
          set -euxo pipefail

          echo "Looking for DMG..."

          find build \
            -maxdepth 2 \
            -type f \
            -name "*.dmg" \
            -print

          DMG_COUNT="$(find build \
            -maxdepth 2 \
            -type f \
            -name "*.dmg" \
            | wc -l | tr -d ' ')"

          if [ "$DMG_COUNT" -lt 1 ]; then
            echo "ERROR: No DMG was produced."
            exit 1
          fi

          echo "DMG verification successful."

      # ------------------------------------------------------------
      # Upload DMG
      # ------------------------------------------------------------
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Mixxx-2.4.2-macOS-Intel-DMG
          path: build/*.dmg
          if-no-files-found: error
