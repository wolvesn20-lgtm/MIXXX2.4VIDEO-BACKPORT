name: CMake Cloud Build and Package Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15-intel

    steps:
      - name: Checkout Primary Repository Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: source_repo

      - name: Remove Test-Only moc Source from Mixxx Library
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cmake_file = Path("source_repo/source/CMakeLists.txt")
          lines = cmake_file.read_text().splitlines(keepends=True)
          target_line = "  src/util/moc_included_test.cpp\n"
          indexes = [
              i for i, line in enumerate(lines)
              if line == target_line
          ]
          if len(indexes) != 2:
              raise SystemExit(
                  f"ERROR: Expected exactly 2 moc_included_test.cpp entries, "
                  f"found {len(indexes)}"
              )
          del lines[indexes[0]]
          cmake_file.write_text("".join(lines))
          print("Removed moc_included_test.cpp from mixxx-lib.")
          print("Kept moc_included_test.cpp in mixxx-test.")
          PY
          echo "Remaining moc_included_test.cpp source entry:"
          grep -n "^[[:space:]]*src/util/moc_included_test.cpp[[:space:]]*$" \
            source_repo/source/CMakeLists.txt
          COUNT="$(
            grep -c "^[[:space:]]*src/util/moc_included_test.cpp[[:space:]]*$" \
              source_repo/source/CMakeLists.txt || true
          )"
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one remaining moc_included_test.cpp source entry."
            exit 1
          fi
          echo "Source patch verification successful."

      - name: Install Compatible CMake
        run: |
          set -euxo pipefail
          brew uninstall --ignore-dependencies cmake || true
          curl -L \
            https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-macos-universal.tar.gz \
            -o /tmp/cmake.tar.gz
          sudo tar -xzf /tmp/cmake.tar.gz -C /usr/local
          CMAKE_DIR="/usr/local/cmake-3.28.6-macos-universal/CMake.app/Contents/bin"
          echo "$CMAKE_DIR" >> "$GITHUB_PATH"
          export PATH="$CMAKE_DIR:$PATH"
          cmake --version

      - name: Remove conflicting OpenSSL 1.1 link
        run: |
          set -euxo pipefail
          brew unlink openssl@1.1 || true
          if [ -L "/usr/local/bin/openssl" ] && \
             readlink "/usr/local/bin/openssl" | grep -q "openssl@1.1"; then
            rm -f "/usr/local/bin/openssl"
          fi

      - name: Install All Core Mixxx Dependencies
        run: |
          set -euxo pipefail
          brew update
          brew install \
            ffmpeg \
            googletest \
            chromaprint \
            google-benchmark \
            libebur128 \
            fftw \
            libkeyfinder \
            flac \
            libvorbis \
            sound-touch \
            portaudio \
            hidapi \
            portmidi \
            protobuf \
            rubberband \
            boost \
            taglib \
            cpp-gsl \
            pkg-config

      - name: Set Up Qt5 Environment
        uses: jurplel/install-qt-action@v4
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          version: "5.15.2"
          host: "mac"
          target: "desktop"
          dir: "${{ github.workspace }}/qt"
          setup-python: true

      - name: Build Qt5Keychain
        run: |
          set -euxo pipefail
          git clone \
            --depth 1 \
            --branch 0.15.0 \
            https://github.com/frankosterfeld/qtkeychain.git \
            qtkeychain_src
          WORKSPACE="${GITHUB_WORKSPACE}"
          QT_PREFIX="$WORKSPACE/qt/Qt/5.15.2/macos"
          QTKEYCHAIN_PREFIX="$WORKSPACE/qtkeychain_install"
          cmake \
            -S qtkeychain_src \
            -B qtkeychain_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$QTKEYCHAIN_PREFIX" \
            -DBUILD_WITH_QT6=OFF \
            -DBUILD_TRANSLATIONS=OFF \
            -DBUILD_TESTING=OFF
          cmake \
            --build qtkeychain_build \
            --config Release \
            --parallel 4
          cmake \
            --install qtkeychain_build \
            --config Release
          echo "Qt5Keychain installation:"
          find "${QTKEYCHAIN_PREFIX}" \
            -type f \
            -print

      - name: Clone Legacy TagLib 1.11.1 Source
        uses: actions/checkout@v4
        with:
          repository: taglib/taglib
          ref: v1.11.1
          path: taglib_src

      - name: Configure Legacy TagLib
        run: |
          set -euxo pipefail
          cmake \
            -S taglib_src \
            -B taglib_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/taglib_install"

      - name: Build and Install Legacy TagLib
        run: |
          set -euxo pipefail
          cmake \
            --build taglib_build \
            --config Release \
            --parallel 4
          cmake \
            --install taglib_build \
            --config Release

      - name: Verify Legacy TagLib Installation
        run: |
          set -euxo pipefail
          echo "TagLib installation:"
          find "${{ github.workspace }}/taglib_install" \
            -type f \
            -print

      - name: Verify Qt5Keychain Package
        run: |
          set -euxo pipefail
          QTKEYCHAIN_PREFIX="${{ github.workspace }}/qtkeychain_install"
          echo "Searching for Qt5Keychain CMake package files:"
          find "${QTKEYCHAIN_PREFIX}" \
            -type f \
            \( \
              -name "Qt5KeychainConfig.cmake" \
              -o \
              -name "qt5keychain-config.cmake" \
            \) \
            -print
          if ! find "${QTKEYCHAIN_PREFIX}" \
            -type f \
            \( \
              -name "Qt5KeychainConfig.cmake" \
              -o \
              -name "qt5keychain-config.cmake" \
            \) \
            | grep -q .; then
            echo "ERROR: Qt5Keychain CMake package could not be found."
            exit 1
          fi

      - name: Configure Mixxx CMake Project
        run: |
          set -euxo pipefail
          rm -rf build
          QT_PREFIX="${GITHUB_WORKSPACE}/qt/Qt/5.15.2/macos"
          TAGLIB_PREFIX="${GITHUB_WORKSPACE}/taglib_install"
          QTKEYCHAIN_PREFIX="${GITHUB_WORKSPACE}/qtkeychain_install"
          export PKG_CONFIG_PATH="${TAGLIB_PREFIX}/lib/pkgconfig"
          export CMAKE_PREFIX_PATH="${QT_PREFIX};${QTKEYCHAIN_PREFIX};${TAGLIB_PREFIX}"
          echo "CMAKE_PREFIX_PATH:"
          echo "$CMAKE_PREFIX_PATH"
          echo "Qt5:"
          qmake -v
          echo "Locating Qt5Keychain CMake package..."
          QT5KEYCHAIN_CONFIG="$(
            find "${QTKEYCHAIN_PREFIX}" \
              -type f \
              \( \
                -name "Qt5KeychainConfig.cmake" \
                -o \
                -name "qt5keychain-config.cmake" \
              \) \
              -print -quit
          )"
          if [ -z "$QT5KEYCHAIN_CONFIG" ]; then
            echo "ERROR: Qt5Keychain CMake package was not found."
            exit 1
          fi
          QT5KEYCHAIN_DIR="$(dirname "$QT5KEYCHAIN_CONFIG")"
          echo "Qt5Keychain config:"
          echo "$QT5KEYCHAIN_CONFIG"
          echo "Qt5Keychain CMake directory:"
          echo "$QT5KEYCHAIN_DIR"
          cmake \
            -S source_repo/source \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_EXE_LINKER_FLAGS="-framework AudioToolbox -framework AppKit" \
            -DTESTING=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCH=OFF \
            -DOPTIMIZE=portable \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DQt5Keychain_DIR="$QT5KEYCHAIN_DIR"

      - name: Build Mixxx Application
        run: |
          set -euxo pipefail
          export VERBOSE=1
          cmake \
            --build build \
            --config Release \
            --parallel 4 \
            --verbose

      - name: Bundle Qt and Dependencies
        run: |
          set -euxo pipefail
          QT_PREFIX="${GITHUB_WORKSPACE}/qt/Qt/5.15.2/macos"
          APP="$(find build -maxdepth 3 -type d -name 'Mixxx.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "ERROR: Mixxx.app not found under build/"
            echo "Available .app bundles:"
            find build -maxdepth 4 -type d -name '*.app' -print
            exit 1
          fi
          echo "Bundling: $APP"
          "$QT_PREFIX/bin/macdeployqt" "$APP" -verbose=2

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          set -euxo pipefail
          APP="$(find build -maxdepth 3 -type d -name 'Mixxx.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "ERROR: Mixxx.app not found under build/"
            exit 1
          fi
          OUT="Mixxx-2.4-VIDEO-BACKPORT-macOS-10.13.dmg"
          rm -f "$OUT"
          create-dmg \
            --volname "Mixxx 2.4" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            --no-code-sign \
            "$OUT" \
            "$APP" || true
          if [ ! -f "$OUT" ]; then
            echo "ERROR: DMG was not created."
            exit 1
          fi
          ls -lh "$OUT"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: MIXXX2.4-VIDEO-BACKPORT-macos-intel-DMG
          path: Mixxx-2.4-VIDEO-BACKPORT-macOS-10.13.dmg
          if-no-files-found: error
          retention-days: 7
