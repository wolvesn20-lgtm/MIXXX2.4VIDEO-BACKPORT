name: CMake Cloud Build and Package Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15-intel

    steps:
    - name: Checkout Primary Repository Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        path: source_repo

    - name: Install All Core Mixxx Dependencies
      run: |
        echo "Installing core libraries and frameworks..."
        # Explicitly omitting taglib here to keep the global workspace unpolluted
        brew install ffmpeg googletest chromaprint google-benchmark libebur128 fftw libkeyfinder flac libvorbis sound-touch portaudio hidapi portmidi protobuf rubberband boost pkg-config

    - name: Set Up Qt5 Environment
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'mac'
        target: 'desktop'
        dir: '${{ github.workspace }}/qt'

    # NEW SECURE APPROACH: Use actions/checkout to pull the clean legacy TagLib repository safely 
    - name: Clone Legacy TagLib 1.11.1 Source
      uses: actions/checkout@v4
      with:
        repository: taglib/taglib
        ref: v1.11.1
        path: taglib_src

    # Compile TagLib cleanly in its own isolated container to avoid mixing up CMake variables
    - name: Build Isolated Legacy TagLib Static Target
      run: |
        cmake -B taglib_build -S taglib_src \
  -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    - name: Configure CMake Project for High Sierra
      run: |
        echo "Configuring main project tracking path mappings..."
        # Directing CMake to find your custom built TagLib binaries in the local workspace directory
        cmake -B build -S source_repo/source \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
          -DTESTING=OFF \
          -DBUILD_TESTING=OFF \
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/qt/Qt/5.15.2/macos/lib/cmake;${{ github.workspace }}/taglib_build"

    - name: Compile and Build Application
      run: |
        cmake --build build --config Release --parallel 4

    - name: Package and Upload Completed Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MIXXX2.4-VIDEO-BACKPORT-BUILD
        path: build/
        retention-days: 7

